<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <title>Hooded Escape</title>

  <style>
    /* ==================================================
       基礎設定
    ================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #07090e;

      touch-action: none;
      overscroll-behavior: none;

      font-family:
        Arial,
        "Microsoft JhengHei",
        sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button,
    select {
      font: inherit;
    }

    /* ==================================================
       遊戲主容器
    ================================================== */

    #game-wrapper {
      position: relative;

      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));

      max-width: 1280px;
      max-height: 720px;

      overflow: hidden;

      background: #111722;
    }

    #game-canvas {
      display: block;

      width: 100%;
      height: 100%;

      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* ==================================================
       手機直向提示
    ================================================== */

    #orientation-screen {
      position: absolute;
      inset: 0;
      z-index: 500;

      display: none;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at center,
          #171d2a 0%,
          #090c12 72%
        );

      color: #ffffff;
    }

    .orientation-content {
      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 24px;

      padding: 30px;

      text-align: center;

      animation: orientationBreathe 2s ease-in-out infinite;
    }

    .phone-rotate-icon {
      position: relative;

      width: 74px;
      height: 122px;

      border: 4px solid rgba(255, 255, 255, 0.9);
      border-radius: 14px;

      transform: rotate(-18deg);

      animation: phoneRotate 2.2s ease-in-out infinite;
    }

    .phone-rotate-icon::before {
      content: "";

      position: absolute;
      left: 50%;
      bottom: 7px;

      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: rgba(255, 255, 255, 0.9);

      transform: translateX(-50%);
    }

    .phone-rotate-icon::after {
      content: "↻";

      position: absolute;
      top: 50%;
      left: 100%;

      margin-left: 20px;

      color: rgba(255, 255, 255, 0.85);

      font-size: 46px;

      transform: translateY(-50%);
    }

    .orientation-title {
      font-size: clamp(24px, 6vw, 38px);
      font-weight: 700;

      letter-spacing: 2px;
    }

    .orientation-subtitle {
      color: rgba(255, 255, 255, 0.65);

      font-size: clamp(14px, 3.5vw, 18px);
      line-height: 1.6;
    }

    @keyframes orientationBreathe {
      0%,
      100% {
        opacity: 0.58;
        transform: scale(0.96);
      }

      50% {
        opacity: 1;
        transform: scale(1.04);
      }
    }

    @keyframes phoneRotate {
      0%,
      100% {
        transform: rotate(-18deg);
      }

      50% {
        transform: rotate(72deg);
      }
    }

    /* ==================================================
       Loading Page
    ================================================== */

    #loading-page {
      position: absolute;
      inset: 0;
      z-index: 400;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 42%,
          rgba(48, 58, 80, 0.62) 0%,
          rgba(14, 18, 28, 0.96) 48%,
          #07090e 100%
        );

      opacity: 1;
      visibility: visible;

      transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
    }

    #loading-page.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #loading-page::before {
      content: "";

      position: absolute;
      inset: 0;

      opacity: 0.12;

      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.04) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.04) 1px,
          transparent 1px
        );

      background-size: 48px 48px;

      animation: loadingGridMove 10s linear infinite;
    }

    #loading-page::after {
      content: "";

      position: absolute;
      left: 50%;
      bottom: -130px;

      width: 640px;
      height: 260px;

      border-radius: 50%;

      background:
        radial-gradient(
          ellipse,
          rgba(93, 111, 148, 0.25) 0%,
          transparent 70%
        );

      transform: translateX(-50%);
    }

    @keyframes loadingGridMove {
      from {
        background-position: 0 0;
      }

      to {
        background-position: 48px 48px;
      }
    }

    .loading-content {
      position: relative;
      z-index: 2;

      width: min(78%, 560px);

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;
    }

    .game-logo {
      margin-bottom: 50px;

      opacity: 0;

      transform: translateY(18px);

      animation: logoFadeIn 0.9s ease forwards;
    }

    .logo-main {
      display: block;

      color: #f4f5f7;

      font-size: clamp(42px, 7vw, 86px);
      font-weight: 900;

      letter-spacing: clamp(6px, 1.1vw, 14px);

      text-shadow:
        0 4px 0 rgba(0, 0, 0, 0.45),
        0 12px 28px rgba(0, 0, 0, 0.6);
    }

    .logo-sub {
      display: block;

      margin-top: 4px;

      color: rgba(199, 207, 225, 0.72);

      font-size: clamp(13px, 1.8vw, 22px);
      font-weight: 600;

      letter-spacing: clamp(8px, 1.5vw, 18px);
    }

    @keyframes logoFadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #loading-status {
      width: 100%;

      opacity: 1;

      transition:
        opacity 0.35s ease,
        transform 0.35s ease;
    }

    #loading-status.hidden {
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
    }

    .loading-text {
      margin-bottom: 12px;

      display: flex;
      justify-content: space-between;

      color: rgba(255, 255, 255, 0.78);

      font-size: clamp(13px, 1.8vw, 18px);
      letter-spacing: 1px;
    }

    #progress-track {
      position: relative;

      width: 100%;
      height: clamp(12px, 1.7vw, 18px);

      overflow: hidden;

      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;

      background: rgba(0, 0, 0, 0.36);
    }

    #progress-bar {
      width: 0%;
      height: 100%;

      border-radius: inherit;

      background:
        linear-gradient(
          90deg,
          #6f7f9e,
          #b6c0d4,
          #7585a4
        );

      box-shadow:
        0 0 16px rgba(178, 193, 219, 0.38);

      transition: width 0.12s linear;
    }

    #progress-bar::after {
      content: "";

      display: block;

      width: 120px;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.55),
          transparent
        );

      animation: loadingShine 1.2s linear infinite;
    }

    @keyframes loadingShine {
      from {
        transform: translateX(-130px);
      }

      to {
        transform: translateX(600px);
      }
    }

    #enter-dungeon-button {
      position: absolute;
      top: calc(100% - 72px);

      min-width: 230px;

      padding: 15px 34px;

      border: 1px solid rgba(255, 255, 255, 0.42);
      border-radius: 7px;

      background:
        linear-gradient(
          180deg,
          rgba(104, 119, 149, 0.95),
          rgba(48, 58, 80, 0.98)
        );

      color: #ffffff;

      font-size: clamp(17px, 2.2vw, 24px);
      font-weight: 700;

      letter-spacing: 3px;

      cursor: pointer;

      opacity: 0;
      visibility: hidden;

      transform: translateY(14px);

      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.42);

      transition:
        opacity 0.6s ease,
        transform 0.6s ease,
        border-color 0.2s ease,
        background 0.2s ease;
    }

    #enter-dungeon-button.visible {
      opacity: 1;
      visibility: visible;

      transform: translateY(0);
    }

    #enter-dungeon-button:hover {
      border-color: rgba(255, 255, 255, 0.78);

      background:
        linear-gradient(
          180deg,
          rgba(123, 140, 173, 0.98),
          rgba(59, 70, 95, 1)
        );
    }

    #enter-dungeon-button:active {
      transform: scale(0.96);
    }

    /* ==================================================
       遊戲 HUD
    ================================================== */

    #desktop-help {
      position: absolute;
      top: 18px;
      left: 50%;
      z-index: 20;

      transform: translateX(-50%);

      padding: 10px 18px;

      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;

      background: rgba(0, 0, 0, 0.42);
      color: rgba(255, 255, 255, 0.9);

      font-size: 15px;
      white-space: nowrap;

      opacity: 0;
      visibility: hidden;

      transition: opacity 0.4s ease;

      pointer-events: none;
    }

    #keyboard-settings {
      position: absolute;
      top: 22px;
      right: 24px;
      z-index: 25;

      display: flex;
      align-items: center;
      gap: 8px;

      padding: 8px 10px;

      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;

      background: rgba(0, 0, 0, 0.42);
      color: #ffffff;

      font-size: 14px;

      opacity: 0;
      visibility: hidden;

      transition: opacity 0.4s ease;
    }

    #attack-key-select {
      min-width: 58px;

      padding: 5px 8px;

      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 6px;

      background: #1a202b;
      color: #ffffff;

      cursor: pointer;
    }

    body.game-started #desktop-help,
    body.game-started #keyboard-settings {
      opacity: 1;
      visibility: visible;
    }

    /* ==================================================
       手機虛擬控制
    ================================================== */

    #touch-controls {
      position: absolute;
      inset: 0;
      z-index: 30;

      opacity: 0;
      visibility: hidden;

      transition: opacity 0.4s ease;

      pointer-events: none;
    }

    body.game-started #touch-controls {
      opacity: 1;
      visibility: visible;
    }

    #joystick-zone {
      position: absolute;

      left: max(28px, env(safe-area-inset-left));
      bottom: max(28px, env(safe-area-inset-bottom));

      width: clamp(150px, 19vw, 220px);
      height: clamp(150px, 19vw, 220px);

      display: flex;
      align-items: center;
      justify-content: center;

      pointer-events: auto;
      touch-action: none;
    }

    #joystick-base {
      position: relative;

      width: 100%;
      height: 100%;

      border: 3px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;

      background: rgba(8, 11, 18, 0.43);

      box-shadow:
        inset 0 0 28px rgba(255, 255, 255, 0.04),
        0 8px 20px rgba(0, 0, 0, 0.25);

      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    #joystick-base::before,
    #joystick-base::after {
      content: "";

      position: absolute;

      background: rgba(255, 255, 255, 0.1);

      pointer-events: none;
    }

    #joystick-base::before {
      top: 50%;
      left: 15%;
      right: 15%;

      height: 2px;

      transform: translateY(-50%);
    }

    #joystick-base::after {
      left: 50%;
      top: 15%;
      bottom: 15%;

      width: 2px;

      transform: translateX(-50%);
    }

    #joystick-stick {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 48%;
      height: 48%;

      border: 3px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;

      background: rgba(255, 255, 255, 0.17);

      transform: translate(-50%, -50%);

      box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.28);

      pointer-events: none;
    }

    #joystick-zone.active #joystick-stick {
      background: rgba(255, 255, 255, 0.28);
      border-color: rgba(255, 255, 255, 0.75);
    }

    #action-controls {
      position: absolute;

      right: max(30px, env(safe-area-inset-right));
      bottom: max(30px, env(safe-area-inset-bottom));

      display: flex;
      align-items: flex-end;

      gap: clamp(16px, 2vw, 28px);

      pointer-events: auto;
    }

    .action-button {
      width: clamp(70px, 9vw, 108px);
      height: clamp(70px, 9vw, 108px);

      display: flex;
      align-items: center;
      justify-content: center;

      border: 3px solid rgba(255, 255, 255, 0.42);
      border-radius: 50%;

      background: rgba(8, 11, 18, 0.55);
      color: #ffffff;

      font-size: clamp(18px, 2.2vw, 28px);
      font-weight: 700;

      box-shadow:
        0 7px 20px rgba(0, 0, 0, 0.3);

      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);

      touch-action: none;
    }

    .action-button.active {
      transform: scale(0.9);

      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.8);
    }

    #jump-button {
      margin-bottom: clamp(38px, 5vw, 68px);
    }

    /* ==================================================
       裝置判斷
    ================================================== */

    @media (hover: hover) and (pointer: fine) {
      #touch-controls {
        display: none;
      }
    }

    @media (hover: none), (pointer: coarse) {
      #desktop-help,
      #keyboard-settings {
        display: none;
      }
    }

    @media (max-width: 900px) {
      #desktop-help,
      #keyboard-settings {
        display: none;
      }
    }

    @media (orientation: portrait) and (hover: none) {
      #orientation-screen {
        display: flex;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .orientation-content,
      .phone-rotate-icon,
      #loading-page::before,
      #progress-bar::after {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main id="game-wrapper">
    <canvas
      id="game-canvas"
      width="1280"
      height="720"
      tabindex="0"
    ></canvas>

    <!-- 手機直向提示 -->
    <section
      id="orientation-screen"
      aria-label="請旋轉手機"
    >
      <div class="orientation-content">
        <div
          class="phone-rotate-icon"
          aria-hidden="true"
        ></div>

        <div>
          <div class="orientation-title">
            請將手機轉為橫向
          </div>

          <div class="orientation-subtitle">
            橫向模式可獲得最佳遊戲體驗
          </div>
        </div>
      </div>
    </section>

    <!-- Loading Page -->
    <section
      id="loading-page"
      aria-label="遊戲載入畫面"
    >
      <div class="loading-content">
        <div class="game-logo">
          <span class="logo-main">
            HOODED
          </span>

          <span class="logo-sub">
            ESCAPE
          </span>
        </div>

        <div id="loading-status">
          <div class="loading-text">
            <span id="loading-message">
              正在開啟地下城入口……
            </span>

            <span id="progress-number">
              0%
            </span>
          </div>

          <div id="progress-track">
            <div id="progress-bar"></div>
          </div>
        </div>

        <button
          id="enter-dungeon-button"
          type="button"
        >
          進入地下城
        </button>
      </div>
    </section>

    <!-- 電腦版操作提示 -->
    <div id="desktop-help">
      方向鍵移動｜↑ 跳躍｜↓ 蹲下｜Shift 跑步｜攻擊：
      <span id="attack-key-label">Z</span>
    </div>

    <!-- 電腦版攻擊鍵設定 -->
    <div id="keyboard-settings">
      <label for="attack-key-select">
        攻擊鍵
      </label>

      <select id="attack-key-select">
        <option value="KeyZ">Z</option>
        <option value="KeyX">X</option>
        <option value="KeyC">C</option>
        <option value="KeyV">V</option>
        <option value="KeyJ">J</option>
        <option value="KeyK">K</option>
        <option value="KeyL">L</option>
      </select>
    </div>

    <!-- 手機版控制 -->
    <div id="touch-controls">
      <div id="joystick-zone">
        <div id="joystick-base">
          <div id="joystick-stick"></div>
        </div>
      </div>

      <div id="action-controls">
        <button
          id="attack-button"
          class="action-button"
          type="button"
          data-control="attack"
          aria-label="攻擊"
        >
          攻
        </button>

        <button
          id="jump-button"
          class="action-button"
          type="button"
          data-control="jump"
          aria-label="跳躍"
        >
          跳
        </button>
      </div>
    </div>
  </main>

  <script>
    "use strict";

    /* ==================================================
       DOM
    ================================================== */

    const canvas =
      document.getElementById("game-canvas");

    const context =
      canvas.getContext("2d");

    const loadingPage =
      document.getElementById("loading-page");

    const loadingStatus =
      document.getElementById("loading-status");

    const loadingMessage =
      document.getElementById("loading-message");

    const progressBar =
      document.getElementById("progress-bar");

    const progressNumber =
      document.getElementById("progress-number");

    const enterDungeonButton =
      document.getElementById("enter-dungeon-button");

    const attackKeySelect =
      document.getElementById("attack-key-select");

    const attackKeyLabel =
      document.getElementById("attack-key-label");

    context.imageSmoothingEnabled = false;

    /* ==================================================
       遊戲常數
    ================================================== */

    const GAME_WIDTH = 1280;
    const GAME_HEIGHT = 720;

    const GROUND_Y = 615;

    const GRAVITY = 2200;
    const WALK_SPEED = 230;
    const RUN_SPEED = 420;
    const JUMP_FORCE = 820;

    const PLAYER_SCALE = 2.2;

    const JOYSTICK_DEAD_ZONE = 0.14;
    const RUN_THRESHOLD = 0.72;
    const DUCK_THRESHOLD = 0.62;

    const FAKE_LOADING_MIN_TIME = 2600;

    /* ==================================================
       遊戲狀態
    ================================================== */

    let assetsLoaded = false;
    let fakeLoadingCompleted = false;
    let gameStarted = false;
    let gameLoopStarted = false;

    let previousTime = performance.now();

    /* ==================================================
       攻擊鍵設定
    ================================================== */

    const ATTACK_KEY_STORAGE =
      "hoodedCharacterAttackKey";

    const allowedAttackKeys = {
      KeyZ: "Z",
      KeyX: "X",
      KeyC: "C",
      KeyV: "V",
      KeyJ: "J",
      KeyK: "K",
      KeyL: "L"
    };

    let attackKeyCode =
      localStorage.getItem(
        ATTACK_KEY_STORAGE
      ) || "KeyZ";

    if (!allowedAttackKeys[attackKeyCode]) {
      attackKeyCode = "KeyZ";
    }

    attackKeySelect.value = attackKeyCode;
    attackKeyLabel.textContent =
      allowedAttackKeys[attackKeyCode];

    attackKeySelect.addEventListener(
      "change",
      () => {
        attackKeyCode =
          attackKeySelect.value;

        localStorage.setItem(
          ATTACK_KEY_STORAGE,
          attackKeyCode
        );

        attackKeyLabel.textContent =
          allowedAttackKeys[attackKeyCode];

        resetAllInputs();
        canvas.focus();
      }
    );

    /* ==================================================
       動畫設定
    ================================================== */

    const animationDefinitions = {
      idle: {
        folder: "Idle",
        prefix: "idle",
        frameCount: 2,
        frameDuration: 0.42,
        loop: true
      },

      walk: {
        folder: "Walk",
        prefix: "Walk",
        frameCount: 4,
        frameDuration: 0.13,
        loop: true
      },

      run: {
        folder: "Run",
        prefix: "Run",
        frameCount: 8,
        frameDuration: 0.075,
        loop: true
      },

      duck: {
        folder: "Duck",
        prefix: "Duck",
        frameCount: 6,
        frameDuration: 0.08,
        loop: false
      },

      jump: {
        folder: "Jump",
        prefix: "Jump",
        frameCount: 8,
        frameDuration: 0.09,
        loop: false
      },

      attack: {
        folder: "ATK",
        prefix: "ATK",
        frameCount: 8,
        frameDuration: 0.065,
        loop: false
      }
    };

    const animations = {};

    /* ==================================================
       輸入狀態
    ================================================== */

    const input = {
      left: false,
      right: false,
      run: false,
      duck: false,
      jump: false,
      attack: false
    };

    const pressed = {
      jump: false,
      attack: false
    };

    const joystick = {
      active: false,
      pointerId: null,

      centerX: 0,
      centerY: 0,
      radius: 0,

      x: 0,
      y: 0,
      magnitude: 0
    };

    /* ==================================================
       玩家
    ================================================== */

    const player = {
      x: 200,
      y: GROUND_Y,

      velocityX: 0,
      velocityY: 0,

      width: 120,
      height: 120,

      facing: 1,

      grounded: true,
      ducking: false,
      attacking: false,

      animation: "idle",
      frameIndex: 0,
      frameTimer: 0
    };

    /* ==================================================
       素材載入
    ================================================== */

    function padNumber(number) {
      return String(number).padStart(2, "0");
    }

    function createFramePath(
      definition,
      frameNumber
    ) {
      return (
        "2D_Character/" +
        definition.folder +
        "/" +
        definition.prefix +
        padNumber(frameNumber) +
        ".png"
      );
    }

    function loadImage(path) {
      return new Promise(
        (resolve, reject) => {
          const image = new Image();

          image.onload = () => {
            resolve(image);
          };

          image.onerror = () => {
            reject(
              new Error(
                `無法載入圖片：${path}`
              )
            );
          };

          image.src = path;
        }
      );
    }

    async function loadAnimations() {
      const loadingTasks = [];

      for (
        const [
          animationName,
          definition
        ] of Object.entries(
          animationDefinitions
        )
      ) {
        animations[animationName] = {
          frames: [],
          frameDuration:
            definition.frameDuration,
          loop: definition.loop
        };

        for (
          let frameNumber = 1;
          frameNumber <= definition.frameCount;
          frameNumber += 1
        ) {
          const path =
            createFramePath(
              definition,
              frameNumber
            );

          loadingTasks.push(
            loadImage(path).then(
              (image) => {
                animations[
                  animationName
                ].frames[
                  frameNumber - 1
                ] = image;
              }
            )
          );
        }
      }

      await Promise.all(loadingTasks);
    }

    /* ==================================================
       假讀取進度
    ================================================== */

    function updateLoadingText(progress) {
      if (progress < 28) {
        loadingMessage.textContent =
          "正在確認地下城入口……";
      } else if (progress < 56) {
        loadingMessage.textContent =
          "正在喚醒兜帽旅人……";
      } else if (progress < 82) {
        loadingMessage.textContent =
          "正在準備冒險裝備……";
      } else if (progress < 100) {
        loadingMessage.textContent =
          "正在解除入口封印……";
      } else {
        loadingMessage.textContent =
          "地下城入口已開啟";
      }
    }

    function runFakeLoading() {
      return new Promise((resolve) => {
        const startTime =
          performance.now();

        let displayedProgress = 0;

        function update(currentTime) {
          const elapsed =
            currentTime - startTime;

          const normalized =
            Math.min(
              elapsed /
                FAKE_LOADING_MIN_TIME,
              1
            );

          const eased =
            1 -
            Math.pow(
              1 - normalized,
              2.4
            );

          const targetProgress =
            Math.floor(eased * 100);

          displayedProgress =
            Math.max(
              displayedProgress,
              targetProgress
            );

          progressBar.style.width =
            `${displayedProgress}%`;

          progressNumber.textContent =
            `${displayedProgress}%`;

          updateLoadingText(
            displayedProgress
          );

          if (normalized < 1) {
            requestAnimationFrame(
              update
            );
          } else {
            fakeLoadingCompleted = true;
            resolve();
          }
        }

        requestAnimationFrame(update);
      });
    }

    function revealEnterButton() {
      if (
        !assetsLoaded ||
        !fakeLoadingCompleted
      ) {
        return;
      }

      progressBar.style.width = "100%";
      progressNumber.textContent = "100%";

      updateLoadingText(100);

      setTimeout(() => {
        loadingStatus.classList.add(
          "hidden"
        );

        setTimeout(() => {
          enterDungeonButton.classList.add(
            "visible"
          );
        }, 220);
      }, 350);
    }

    /* ==================================================
       開始遊戲
    ================================================== */

    function startGame() {
      if (
        gameStarted ||
        !assetsLoaded ||
        !fakeLoadingCompleted
      ) {
        return;
      }

      gameStarted = true;

      resetAllInputs();

      loadingPage.classList.add(
        "hidden"
      );

      document.body.classList.add(
        "game-started"
      );

      canvas.focus();

      setTimeout(() => {
        updateJoystickCenter();
      }, 50);
    }

    enterDungeonButton.addEventListener(
      "click",
      startGame
    );

    enterDungeonButton.addEventListener(
      "pointerdown",
      (event) => {
        event.stopPropagation();
      }
    );

    /* ==================================================
       動畫控制
    ================================================== */

    function setAnimation(
      animationName,
      restart = false
    ) {
      if (!animations[animationName]) {
        return;
      }

      if (
        player.animation !==
          animationName ||
        restart
      ) {
        player.animation =
          animationName;

        player.frameIndex = 0;
        player.frameTimer = 0;
      }
    }

    function updateAnimation(deltaTime) {
      const animation =
        animations[player.animation];

      if (
        !animation ||
        animation.frames.length === 0
      ) {
        return;
      }

      if (player.animation === "jump") {
        const lastFrame =
          animation.frames.length - 1;

        if (player.velocityY < -520) {
          player.frameIndex =
            Math.min(1, lastFrame);
        } else if (
          player.velocityY < -260
        ) {
          player.frameIndex =
            Math.min(2, lastFrame);
        } else if (
          player.velocityY < -60
        ) {
          player.frameIndex =
            Math.min(3, lastFrame);
        } else if (
          player.velocityY < 160
        ) {
          player.frameIndex =
            Math.min(4, lastFrame);
        } else if (
          player.velocityY < 380
        ) {
          player.frameIndex =
            Math.min(5, lastFrame);
        } else if (
          player.velocityY < 620
        ) {
          player.frameIndex =
            Math.min(6, lastFrame);
        } else {
          player.frameIndex =
            Math.min(7, lastFrame);
        }

        return;
      }

      player.frameTimer += deltaTime;

      while (
        player.frameTimer >=
        animation.frameDuration
      ) {
        player.frameTimer -=
          animation.frameDuration;

        player.frameIndex += 1;

        if (
          player.frameIndex >=
          animation.frames.length
        ) {
          if (animation.loop) {
            player.frameIndex = 0;
          } else {
            player.frameIndex =
              animation.frames.length - 1;

            if (
              player.animation ===
              "attack"
            ) {
              player.attacking = false;

              setAnimation(
                "idle",
                true
              );
            }
          }
        }
      }
    }

    /* ==================================================
       玩家控制
    ================================================== */

    function triggerJump() {
      if (
        !gameStarted ||
        !player.grounded ||
        player.attacking ||
        player.ducking
      ) {
        return;
      }

      player.grounded = false;
      player.ducking = false;

      player.velocityY = -JUMP_FORCE;

      setAnimation("jump", true);
    }

    function triggerAttack() {
      if (
        !gameStarted ||
        player.attacking
      ) {
        return;
      }

      player.attacking = true;
      player.ducking = false;
      player.velocityX = 0;

      setAnimation("attack", true);
    }

    function choosePlayerAnimation(
      horizontalDirection,
      analogStrength
    ) {
      if (player.attacking) {
        setAnimation("attack");
        return;
      }

      if (!player.grounded) {
        setAnimation("jump");
        return;
      }

      if (player.ducking) {
        setAnimation("duck");
        return;
      }

      if (
        Math.abs(horizontalDirection) >
        JOYSTICK_DEAD_ZONE
      ) {
        const shouldRun =
          input.run ||
          analogStrength >=
            RUN_THRESHOLD;

        setAnimation(
          shouldRun
            ? "run"
            : "walk"
        );

        return;
      }

      setAnimation("idle");
    }

    function updatePlayer(deltaTime) {
      if (!gameStarted) {
        updateAnimation(deltaTime);
        return;
      }

      if (pressed.jump) {
        triggerJump();
        pressed.jump = false;
      }

      if (pressed.attack) {
        triggerAttack();
        pressed.attack = false;
      }

      let horizontalDirection =
        Number(input.right) -
        Number(input.left);

      let analogStrength =
        Math.abs(horizontalDirection);

      if (joystick.active) {
        horizontalDirection =
          joystick.x;

        analogStrength =
          joystick.magnitude;
      }

      const joystickDucking =
        joystick.active &&
        joystick.y >
          DUCK_THRESHOLD &&
        Math.abs(joystick.x) < 0.55;

      player.ducking =
        (
          input.duck ||
          joystickDucking
        ) &&
        player.grounded &&
        !player.attacking;

      if (
        !player.attacking &&
        !player.ducking
      ) {
        if (
          Math.abs(
            horizontalDirection
          ) >
          JOYSTICK_DEAD_ZONE
        ) {
          const shouldRun =
            input.run ||
            analogStrength >=
              RUN_THRESHOLD;

          const speed =
            shouldRun
              ? RUN_SPEED
              : WALK_SPEED;

          player.velocityX =
            horizontalDirection *
            speed;

          player.facing =
            horizontalDirection > 0
              ? 1
              : -1;
        } else {
          horizontalDirection = 0;
          player.velocityX = 0;
        }
      } else {
        player.velocityX = 0;
      }

      if (!player.grounded) {
        player.velocityY +=
          GRAVITY * deltaTime;
      }

      player.x +=
        player.velocityX *
        deltaTime;

      player.y +=
        player.velocityY *
        deltaTime;

      const boundary =
        player.width * 0.35;

      player.x = Math.max(
        boundary,
        Math.min(
          GAME_WIDTH - boundary,
          player.x
        )
      );

      if (player.y >= GROUND_Y) {
        player.y = GROUND_Y;
        player.velocityY = 0;
        player.grounded = true;
      }

      choosePlayerAnimation(
        horizontalDirection,
        analogStrength
      );

      updateAnimation(deltaTime);
    }

    /* ==================================================
       畫面繪製
    ================================================== */

    function drawBackground() {
      const gradient =
        context.createLinearGradient(
          0,
          0,
          0,
          GAME_HEIGHT
        );

      gradient.addColorStop(
        0,
        "#252e40"
      );

      gradient.addColorStop(
        1,
        "#111722"
      );

      context.fillStyle = gradient;

      context.fillRect(
        0,
        0,
        GAME_WIDTH,
        GAME_HEIGHT
      );

      context.fillStyle = "#303846";

      context.fillRect(
        0,
        GROUND_Y,
        GAME_WIDTH,
        GAME_HEIGHT - GROUND_Y
      );

      context.fillStyle = "#697588";

      context.fillRect(
        0,
        GROUND_Y,
        GAME_WIDTH,
        5
      );

      context.fillStyle =
        "rgba(255, 255, 255, 0.06)";

      for (
        let x = 0;
        x < GAME_WIDTH;
        x += 84
      ) {
        context.fillRect(
          x,
          GROUND_Y + 38,
          48,
          4
        );
      }
    }

    function drawPlayerShadow() {
      context.save();

      context.globalAlpha = 0.25;
      context.fillStyle = "#000000";

      context.beginPath();

      context.ellipse(
        player.x,
        GROUND_Y + 5,
        42,
        10,
        0,
        0,
        Math.PI * 2
      );

      context.fill();
      context.restore();
    }

    function drawPlayer() {
      const animation =
        animations[player.animation];

      if (
        !animation ||
        animation.frames.length === 0
      ) {
        return;
      }

      const frame =
        animation.frames[
          Math.min(
            player.frameIndex,
            animation.frames.length - 1
          )
        ];

      if (!frame) {
        return;
      }

      const drawWidth =
        frame.width *
        PLAYER_SCALE;

      const drawHeight =
        frame.height *
        PLAYER_SCALE;

      context.save();

      context.translate(
        Math.round(player.x),
        Math.round(player.y)
      );

      context.scale(
        player.facing,
        1
      );

      context.drawImage(
        frame,
        Math.round(
          -drawWidth / 2
        ),
        Math.round(
          -drawHeight
        ),
        Math.round(drawWidth),
        Math.round(drawHeight)
      );

      context.restore();
    }

    function getStatusText() {
      const statusNames = {
        idle: "待機",
        walk: "行走",
        run: "跑步",
        duck: "蹲下",
        jump: "跳躍",
        attack: "攻擊"
      };

      return (
        statusNames[
          player.animation
        ] ||
        player.animation
      );
    }

    function drawStatus() {
      if (!gameStarted) {
        return;
      }

      context.save();

      context.fillStyle =
        "rgba(0, 0, 0, 0.35)";

      context.fillRect(
        24,
        24,
        210,
        72
      );

      context.fillStyle =
        "#ffffff";

      context.font =
        "22px Arial, Microsoft JhengHei";

      context.fillText(
        `動畫：${getStatusText()}`,
        42,
        57
      );

      context.fillStyle =
        "rgba(255, 255, 255, 0.72)";

      context.font =
        "18px Arial, Microsoft JhengHei";

      context.fillText(
        player.grounded
          ? "狀態：地面"
          : "狀態：空中",
        42,
        84
      );

      context.restore();
    }

    function render() {
      context.clearRect(
        0,
        0,
        GAME_WIDTH,
        GAME_HEIGHT
      );

      drawBackground();
      drawPlayerShadow();
      drawPlayer();
      drawStatus();
    }

    /* ==================================================
       鍵盤輸入
    ================================================== */

    function getControlFromKey(code) {
      if (code === attackKeyCode) {
        return "attack";
      }

      const keyBindings = {
        ArrowLeft: "left",
        KeyA: "left",

        ArrowRight: "right",
        KeyD: "right",

        ArrowUp: "jump",
        KeyW: "jump",
        Space: "jump",

        ArrowDown: "duck",
        KeyS: "duck",

        ShiftLeft: "run",
        ShiftRight: "run"
      };

      return (
        keyBindings[code] ||
        null
      );
    }

    function setControl(
      controlName,
      active,
      isNewPress = false
    ) {
      if (!(controlName in input)) {
        return;
      }

      if (
        active &&
        isNewPress &&
        (
          controlName === "jump" ||
          controlName === "attack"
        )
      ) {
        pressed[controlName] = true;
      }

      input[controlName] = active;
    }

    window.addEventListener(
      "keydown",
      (event) => {
        if (
          !gameStarted ||
          document.activeElement ===
            attackKeySelect
        ) {
          return;
        }

        const controlName =
          getControlFromKey(
            event.code
          );

        if (!controlName) {
          return;
        }

        event.preventDefault();

        const isNewPress =
          !input[controlName];

        setControl(
          controlName,
          true,
          isNewPress
        );
      }
    );

    window.addEventListener(
      "keyup",
      (event) => {
        const controlName =
          getControlFromKey(
            event.code
          );

        if (!controlName) {
          return;
        }

        event.preventDefault();

        setControl(
          controlName,
          false
        );
      }
    );

    /* ==================================================
       虛擬搖桿
    ================================================== */

    const joystickZone =
      document.getElementById(
        "joystick-zone"
      );

    const joystickBase =
      document.getElementById(
        "joystick-base"
      );

    const joystickStick =
      document.getElementById(
        "joystick-stick"
      );

    function updateJoystickCenter() {
      const rect =
        joystickBase.getBoundingClientRect();

      joystick.centerX =
        rect.left +
        rect.width / 2;

      joystick.centerY =
        rect.top +
        rect.height / 2;

      joystick.radius =
        rect.width * 0.34;
    }

    function updateJoystickPosition(
      clientX,
      clientY
    ) {
      const deltaX =
        clientX -
        joystick.centerX;

      const deltaY =
        clientY -
        joystick.centerY;

      const distance =
        Math.hypot(
          deltaX,
          deltaY
        );

      const limitedDistance =
        Math.min(
          distance,
          joystick.radius
        );

      const angle =
        Math.atan2(
          deltaY,
          deltaX
        );

      const visualX =
        Math.cos(angle) *
        limitedDistance;

      const visualY =
        Math.sin(angle) *
        limitedDistance;

      joystickStick.style.transform =
        `translate(
          calc(-50% + ${visualX}px),
          calc(-50% + ${visualY}px)
        )`;

      const normalizedX =
        joystick.radius > 0
          ? visualX /
            joystick.radius
          : 0;

      const normalizedY =
        joystick.radius > 0
          ? visualY /
            joystick.radius
          : 0;

      joystick.x =
        Math.abs(normalizedX) <
        JOYSTICK_DEAD_ZONE
          ? 0
          : normalizedX;

      joystick.y =
        Math.abs(normalizedY) <
        JOYSTICK_DEAD_ZONE
          ? 0
          : normalizedY;

      joystick.magnitude =
        Math.min(
          1,
          Math.hypot(
            joystick.x,
            joystick.y
          )
        );
    }

    function resetJoystick() {
      joystick.active = false;
      joystick.pointerId = null;

      joystick.x = 0;
      joystick.y = 0;
      joystick.magnitude = 0;

      joystickStick.style.transform =
        "translate(-50%, -50%)";

      joystickZone.classList.remove(
        "active"
      );
    }

    joystickZone.addEventListener(
      "pointerdown",
      (event) => {
        if (!gameStarted) {
          return;
        }

        event.preventDefault();

        updateJoystickCenter();

        joystick.active = true;
        joystick.pointerId =
          event.pointerId;

        joystickZone.classList.add(
          "active"
        );

        if (
          joystickZone.setPointerCapture
        ) {
          joystickZone.setPointerCapture(
            event.pointerId
          );
        }

        updateJoystickPosition(
          event.clientX,
          event.clientY
        );
      }
    );

    joystickZone.addEventListener(
      "pointermove",
      (event) => {
        if (
          !gameStarted ||
          !joystick.active ||
          event.pointerId !==
            joystick.pointerId
        ) {
          return;
        }

        event.preventDefault();

        updateJoystickPosition(
          event.clientX,
          event.clientY
        );
      }
    );

    joystickZone.addEventListener(
      "pointerup",
      (event) => {
        if (
          event.pointerId !==
          joystick.pointerId
        ) {
          return;
        }

        event.preventDefault();
        resetJoystick();
      }
    );

    joystickZone.addEventListener(
      "pointercancel",
      resetJoystick
    );

    joystickZone.addEventListener(
      "lostpointercapture",
      resetJoystick
    );

    /* ==================================================
       手機動作鍵
    ================================================== */

    document
      .querySelectorAll(
        ".action-button"
      )
      .forEach((button) => {
        const controlName =
          button.dataset.control;

        function activate(event) {
          if (!gameStarted) {
            return;
          }

          event.preventDefault();

          const isNewPress =
            !input[controlName];

          button.classList.add(
            "active"
          );

          setControl(
            controlName,
            true,
            isNewPress
          );

          if (
            button.setPointerCapture
          ) {
            button.setPointerCapture(
              event.pointerId
            );
          }
        }

        function deactivate(event) {
          event.preventDefault();

          button.classList.remove(
            "active"
          );

          setControl(
            controlName,
            false
          );
        }

        button.addEventListener(
          "pointerdown",
          activate
        );

        button.addEventListener(
          "pointerup",
          deactivate
        );

        button.addEventListener(
          "pointercancel",
          deactivate
        );

        button.addEventListener(
          "lostpointercapture",
          deactivate
        );

        button.addEventListener(
          "contextmenu",
          (event) => {
            event.preventDefault();
          }
        );
      });

    /* ==================================================
       重置輸入
    ================================================== */

    function resetAllInputs() {
      for (
        const controlName of
        Object.keys(input)
      ) {
        input[controlName] = false;
      }

      pressed.jump = false;
      pressed.attack = false;

      resetJoystick();

      document
        .querySelectorAll(
          ".action-button"
        )
        .forEach((button) => {
          button.classList.remove(
            "active"
          );
        });
    }

    window.addEventListener(
      "blur",
      resetAllInputs
    );

    document.addEventListener(
      "visibilitychange",
      () => {
        if (document.hidden) {
          resetAllInputs();
        }
      }
    );

    window.addEventListener(
      "resize",
      () => {
        updateJoystickCenter();
      }
    );

    window.addEventListener(
      "orientationchange",
      () => {
        resetAllInputs();

        setTimeout(() => {
          updateJoystickCenter();
        }, 250);
      }
    );

    /* ==================================================
       遊戲循環
    ================================================== */

    function gameLoop(currentTime) {
      const rawDeltaTime =
        (
          currentTime -
          previousTime
        ) / 1000;

      const deltaTime =
        Math.min(
          rawDeltaTime,
          1 / 30
        );

      previousTime =
        currentTime;

      if (assetsLoaded) {
        updatePlayer(deltaTime);
        render();
      }

      requestAnimationFrame(
        gameLoop
      );
    }

    /* ==================================================
       初始化
    ================================================== */

    async function initializeGame() {
      if (!gameLoopStarted) {
        gameLoopStarted = true;

        requestAnimationFrame(
          gameLoop
        );
      }

      try {
        const [
          animationResult
        ] = await Promise.all([
          loadAnimations(),
          runFakeLoading()
        ]);

        void animationResult;

        assetsLoaded = true;

        revealEnterButton();
      } catch (error) {
        console.error(error);

        loadingMessage.textContent =
          "素材載入失敗，請檢查圖片路徑";

        progressNumber.textContent =
          "錯誤";

        progressBar.style.width =
          "100%";

        progressBar.style.background =
          "#944b4b";
      }
    }

    initializeGame();
  </script>
</body>

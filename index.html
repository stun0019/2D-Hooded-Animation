function playerHud(){const x=22,y=22,w=170+(player.level-1)*18,r=player.hp/player.maxHp;ctx.fillStyle="#000a";ctx.fillRect(x-8,y-8,w+16,54);ctx.fillStyle="#fff";ctx.font="bold 16px Arial";ctx.fillText(`LV.${player.level}  HP ${player.hp} / ${player.maxHp}`,x,y+15);ctx.fillStyle="#3b2025";ctx.fillRect(x,y+22,w,22);ctx.fillStyle="#b84552";ctx.fillRect(x,y+22,w*r,22)}function orcHud(){if(orc.dead)return;const w=96,x=w2x(orc.x)-w/2,y=w2y(orc.y)-ENEMY_SCALE*64-4+orcFoot()*ENEMY_SCALE;ctx.fillStyle="#000b";ctx.fillRect(x-1,y-1,w+2,11);ctx.fillStyle="#3c2024";ctx.fillRect(x,y,w,9);ctx.fillStyle="#b84a54";ctx.fillRect(x,y,w*(orc.hp/orc.maxHp),9)}function debug(){ctx.fillStyle="#0008";ctx.fillRect(14,82,300,150);ctx.fillStyle="#fff";ctx.font="16px Arial";[`玩家 ${Math.round(player.x)},${Math.round(player.y)}`,`玩家動作 ${player.animation}`,`玩家無敵 ${player.iframe.toFixed(2)}s`,`ORC ${orc.state}`,`ORC HP ${orc.hp}/${orc.maxHp}`].forEach((t,i)=>ctx.fillText(t,22,105+i*24))}
function render(){ctx.clearRect(0,0,VW,VH);background();world();if(assetsLoaded){if(orc.opacity>0){shadow(orc.x,62,13);drawOrc();orcHud()}shadow(player.x,50,12);drawPlayer()}playerHud();if(gameStarted)debug()}
const controls={ArrowLeft:"left",KeyA:"left",ArrowRight:"right",KeyD:"right",ArrowUp:"jump",KeyW:"jump",Space:"jump",ArrowDown:"duck",KeyS:"duck",ShiftLeft:"run",ShiftRight:"run"};let attackKey=localStorage.getItem("hoodedCharacterAttackKey")||"KeyZ";attackKeySelect.value=attackKey;attackKeyLabel.textContent=attackKey.replace("Key","");attackKeySelect.onchange=()=>{attackKey=attackKeySelect.value;localStorage.setItem("hoodedCharacterAttackKey",attackKey);attackKeyLabel.textContent=attackKey.replace("Key","")};function setControl(c,v,n=false){if(n&&(c==="jump"||c==="attack"))pressed[c]=true;input[c]=v}addEventListener("keydown",e=>{if(!playerControl||gameFailed)return;const c=e.code===attackKey?"attack":controls[e.code];if(!c)return;e.preventDefault();setControl(c,true,!input[c])});addEventListener("keyup",e=>{const c=e.code===attackKey?"attack":controls[e.code];if(c)setControl(c,false)});
function joyCenter(){const r=joystickBase.getBoundingClientRect();joy.cx=r.left+r.width/2;joy.cy=r.top+r.height/2;joy.r=r.width*.34}function joyMove(e){const dx=e.clientX-joy.cx,dy=e.clientY-joy.cy,d=Math.hypot(dx,dy),l=Math.min(d,joy.r),a=Math.atan2(dy,dx),x=Math.cos(a)*l,y=Math.sin(a)*l;joystickStick.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`;joy.x=x/joy.r;joy.y=y/joy.r;joy.m=Math.min(1,Math.hypot(joy.x,joy.y))}function resetJoy(){joy.active=false;joy.x=joy.y=joy.m=0;joystickStick.style.transform="translate(-50%,-50%)"}joystickZone.onpointerdown=e=>{if(!playerControl)return;joyCenter();joy.active=true;joy.id=e.pointerId;joyMove(e)};joystickZone.onpointermove=e=>{if(joy.active&&e.pointerId===joy.id)joyMove(e)};joystickZone.onpointerup=joystickZone.onpointercancel=resetJoy;document.querySelectorAll(".action-button").forEach(b=>{const c=b.dataset.control;b.onpointerdown=e=>{if(!playerControl)return;b.classList.add("active");setControl(c,true,!input[c])};b.onpointerup=b.onpointercancel=()=>{b.classList.remove("active");setControl(c,false)}});function resetInputs(){Object.keys(input).forEach(k=>input[k]=false);pressed.jump=pressed.attack=false;resetJoy()}
function loop(t){const dt=Math.min((t-last)/1000,1/30);last=t;updatePlayer(dt);updateOrc(dt);combat();if(gameStarted)updateCamera(dt);render();requestAnimationFrame(loop)}
if(isTouchDevice()&&innerHeight>innerWidth)orientationScreen.classList.add("visible");else startLoading();requestAnimationFrame(loop);
</script>

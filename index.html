<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <title>Hooded Escape V0.6.1</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #07090e;

      touch-action: none;
      overscroll-behavior: none;

      font-family:
        Arial,
        "Microsoft JhengHei",
        sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button,
    select {
      font: inherit;
    }

    /* ==================================================
       遊戲容器
    ================================================== */

    #game-wrapper {
      position: relative;

      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));

      max-width: 1280px;
      max-height: 720px;

      overflow: hidden;

      background: #111722;
    }

    #game-canvas {
      display: block;

      width: 100%;
      height: 100%;

      background: #111722;

      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* ==================================================
       手機直向提示
    ================================================== */

    #orientation-screen {
      position: absolute;
      inset: 0;
      z-index: 500;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at center,
          #171d2a 0%,
          #090c12 72%
        );

      color: #ffffff;

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition:
        opacity 0.65s ease,
        visibility 0.65s ease;
    }

    #orientation-screen.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #orientation-screen.fade-out {
      opacity: 0;
      visibility: visible;
      pointer-events: none;
    }

    .orientation-content {
      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 24px;
      padding: 30px;

      text-align: center;

      animation:
        orientationBreathe 2s ease-in-out infinite;
    }

    .phone-rotate-icon {
      position: relative;

      width: 74px;
      height: 122px;

      border: 4px solid rgba(255, 255, 255, 0.9);
      border-radius: 14px;

      transform: rotate(-18deg);

      animation:
        phoneRotate 2.2s ease-in-out infinite;
    }

    .phone-rotate-icon::before {
      content: "";

      position: absolute;
      left: 50%;
      bottom: 7px;

      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: rgba(255, 255, 255, 0.9);

      transform: translateX(-50%);
    }

    .phone-rotate-icon::after {
      content: "↻";

      position: absolute;
      top: 50%;
      left: 100%;

      margin-left: 20px;

      color: rgba(255, 255, 255, 0.85);

      font-size: 46px;

      transform: translateY(-50%);
    }

    .orientation-title {
      font-size: clamp(24px, 6vw, 38px);
      font-weight: 700;

      letter-spacing: 2px;
    }

    .orientation-subtitle {
      margin-top: 9px;

      color: rgba(255, 255, 255, 0.65);

      font-size: clamp(14px, 3.5vw, 18px);
      line-height: 1.6;
    }

    @keyframes orientationBreathe {
      0%,
      100% {
        opacity: 0.58;
        transform: scale(0.96);
      }

      50% {
        opacity: 1;
        transform: scale(1.04);
      }
    }

    @keyframes phoneRotate {
      0%,
      100% {
        transform: rotate(-18deg);
      }

      50% {
        transform: rotate(72deg);
      }
    }

    /* ==================================================
       Loading Page
    ================================================== */

    #loading-page {
      position: absolute;
      inset: 0;
      z-index: 400;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 42%,
          rgba(48, 58, 80, 0.62) 0%,
          rgba(14, 18, 28, 0.98) 48%,
          #07090e 100%
        );

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
    }

    #loading-page.prepared {
      visibility: visible;
    }

    #loading-page.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #loading-page.game-entered {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #loading-page::before {
      content: "";

      position: absolute;
      inset: 0;

      opacity: 0.12;

      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.04) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.04) 1px,
          transparent 1px
        );

      background-size: 48px 48px;

      animation:
        loadingGridMove 10s linear infinite;
    }

    #loading-page::after {
      content: "";

      position: absolute;
      left: 50%;
      bottom: -130px;

      width: 640px;
      height: 260px;

      border-radius: 50%;

      background:
        radial-gradient(
          ellipse,
          rgba(93, 111, 148, 0.25) 0%,
          transparent 70%
        );

      transform: translateX(-50%);
    }

    @keyframes loadingGridMove {
      from {
        background-position: 0 0;
      }

      to {
        background-position: 48px 48px;
      }
    }

    .loading-content {
      position: relative;
      z-index: 2;

      width: min(78%, 560px);

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;
    }

    .game-logo {
      margin-bottom: 50px;

      opacity: 0;

      transform: translateY(18px);
    }

    #loading-page.visible .game-logo {
      animation:
        logoFadeIn 0.9s 0.2s ease forwards;
    }

    .logo-main {
      display: block;

      color: #f4f5f7;

      font-size: clamp(42px, 7vw, 86px);
      font-weight: 900;

      letter-spacing: clamp(6px, 1.1vw, 14px);

      text-shadow:
        0 4px 0 rgba(0, 0, 0, 0.45),
        0 12px 28px rgba(0, 0, 0, 0.6);
    }

    .logo-sub {
      display: block;

      margin-top: 4px;

      color: rgba(199, 207, 225, 0.72);

      font-size: clamp(13px, 1.8vw, 22px);
      font-weight: 600;

      letter-spacing: clamp(8px, 1.5vw, 18px);
    }

    @keyframes logoFadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #loading-status {
      width: 100%;

      opacity: 1;
      transform: translateY(0);

      transition:
        opacity 0.4s ease,
        transform 0.4s ease;
    }

    #loading-status.hidden {
      opacity: 0;
      transform: translateY(-10px);

      pointer-events: none;
    }

    .loading-text {
      margin-bottom: 12px;

      display: flex;
      justify-content: space-between;

      gap: 18px;

      color: rgba(255, 255, 255, 0.78);

      font-size: clamp(13px, 1.8vw, 18px);
      letter-spacing: 1px;
    }

    #loading-message {
      text-align: left;
    }

    #progress-number {
      min-width: 48px;

      text-align: right;
    }

    #progress-track {
      position: relative;

      width: 100%;
      height: clamp(12px, 1.7vw, 18px);

      overflow: hidden;

      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;

      background: rgba(0, 0, 0, 0.36);
    }

    #progress-bar {
      position: relative;

      width: 0%;
      height: 100%;

      overflow: hidden;

      border-radius: inherit;

      background:
        linear-gradient(
          90deg,
          #6f7f9e,
          #b6c0d4,
          #7585a4
        );

      box-shadow:
        0 0 16px rgba(178, 193, 219, 0.38);

      transition:
        width 0.08s linear;
    }

    #progress-bar::after {
      content: "";

      position: absolute;
      inset: 0 auto 0 0;

      width: 120px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.55),
          transparent
        );

      animation:
        loadingShine 1.2s linear infinite;
    }

    @keyframes loadingShine {
      from {
        transform: translateX(-130px);
      }

      to {
        transform: translateX(600px);
      }
    }

    #enter-dungeon-button {
      position: absolute;
      top: calc(100% - 72px);

      min-width: 230px;

      padding: 15px 34px;

      border: 1px solid rgba(255, 255, 255, 0.42);
      border-radius: 7px;

      background:
        linear-gradient(
          180deg,
          rgba(104, 119, 149, 0.95),
          rgba(48, 58, 80, 0.98)
        );

      color: #ffffff;

      font-size: clamp(17px, 2.2vw, 24px);
      font-weight: 700;

      letter-spacing: 3px;

      cursor: pointer;

      opacity: 0;
      visibility: hidden;

      transform: translateY(16px);

      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.42);

      transition:
        opacity 0.65s ease,
        transform 0.65s ease,
        border-color 0.2s ease;
    }

    #enter-dungeon-button.visible {
      opacity: 1;
      visibility: visible;

      transform: translateY(0);
    }

    #enter-dungeon-button:hover {
      border-color: rgba(255, 255, 255, 0.8);
    }

    #enter-dungeon-button:active {
      transform: scale(0.96);
    }

    /* ==================================================
       Stage Intro
    ================================================== */

    #stage-intro {
      position: absolute;
      inset: 0;
      z-index: 350;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(0, 0, 0, 0.58);

      opacity: 0;
      visibility: hidden;

      pointer-events: none;
    }

    #stage-intro.visible {
      opacity: 1;
      visibility: visible;
    }

    #stage-intro.fade-out {
      opacity: 0;

      transition:
        opacity 0.5s ease;
    }

    #stage-intro-title {
      color: #ffffff;

      font-size: clamp(52px, 8vw, 104px);
      font-weight: 900;

      letter-spacing: clamp(9px, 1.8vw, 24px);

      text-shadow:
        0 4px 0 rgba(0, 0, 0, 0.55),
        0 14px 36px rgba(0, 0, 0, 0.8);

      opacity: 0;
      transform: scale(0.88);
    }

    #stage-intro.visible #stage-intro-title {
      animation:
        stageTitleEnter 0.3s ease forwards;
    }

    @keyframes stageTitleEnter {
      from {
        opacity: 0;
        transform: scale(0.88);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ==================================================
       FAIL 畫面
    ================================================== */

    #fail-screen {
      position: absolute;
      inset: 0;
      z-index: 360;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 24px;

      background: rgba(0, 0, 0, 0.72);

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition:
        opacity 0.5s ease,
        visibility 0.5s ease;
    }

    #fail-screen.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #fail-title {
      color: #ffffff;

      font-size: clamp(52px, 8vw, 100px);
      font-weight: 900;

      letter-spacing: 8px;

      text-shadow:
        0 6px 30px rgba(0, 0, 0, 0.8);
    }

    #respawn-button {
      min-width: 180px;

      padding: 14px 30px;

      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 8px;

      background:
        linear-gradient(
          180deg,
          #6b7892,
          #364055
        );

      color: #ffffff;

      font-size: 22px;
      font-weight: 700;

      letter-spacing: 3px;

      cursor: pointer;
    }

    /* ==================================================
       電腦版 HUD
    ================================================== */

    #desktop-help {
      position: absolute;
      top: 18px;
      left: 50%;
      z-index: 20;

      transform: translateX(-50%);

      padding: 10px 18px;

      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;

      background: rgba(0, 0, 0, 0.42);
      color: rgba(255, 255, 255, 0.9);

      font-size: 15px;
      white-space: nowrap;

      opacity: 0;
      visibility: hidden;

      pointer-events: none;

      transition:
        opacity 0.4s ease;
    }

    #keyboard-settings {
      position: absolute;
      top: 22px;
      right: 24px;
      z-index: 25;

      display: flex;
      align-items: center;

      gap: 8px;

      padding: 8px 10px;

      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;

      background: rgba(0, 0, 0, 0.42);
      color: #ffffff;

      font-size: 14px;

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 0.4s ease;
    }

    #attack-key-select {
      min-width: 58px;

      padding: 5px 8px;

      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 6px;

      background: #1a202b;
      color: #ffffff;
    }

    body.game-started #desktop-help,
    body.game-started #keyboard-settings {
      opacity: 1;
      visibility: visible;
    }

    /* ==================================================
       手機控制
    ================================================== */

    #touch-controls {
      position: absolute;
      inset: 0;
      z-index: 30;

      opacity: 0;
      visibility: hidden;

      pointer-events: none;

      transition:
        opacity 0.4s ease;
    }

    body.game-started.player-control-enabled #touch-controls {
      opacity: 1;
      visibility: visible;
    }

    #joystick-zone {
      position: absolute;

      left: max(24px, env(safe-area-inset-left));
      bottom: max(24px, env(safe-area-inset-bottom));

      width: clamp(120px, 15vw, 170px);
      height: clamp(120px, 15vw, 170px);

      display: flex;
      align-items: center;
      justify-content: center;

      pointer-events: auto;
      touch-action: none;
    }

    #joystick-base {
      position: relative;

      width: 100%;
      height: 100%;

      border: 3px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;

      background: rgba(8, 11, 18, 0.43);

      box-shadow:
        inset 0 0 28px rgba(255, 255, 255, 0.04),
        0 8px 20px rgba(0, 0, 0, 0.25);

      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    #joystick-base::before,
    #joystick-base::after {
      content: "";

      position: absolute;

      background: rgba(255, 255, 255, 0.1);

      pointer-events: none;
    }

    #joystick-base::before {
      top: 50%;
      left: 15%;
      right: 15%;

      height: 2px;

      transform: translateY(-50%);
    }

    #joystick-base::after {
      left: 50%;
      top: 15%;
      bottom: 15%;

      width: 2px;

      transform: translateX(-50%);
    }

    #joystick-stick {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 48%;
      height: 48%;

      border: 3px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;

      background: rgba(255, 255, 255, 0.17);

      transform: translate(-50%, -50%);

      box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.28);

      pointer-events: none;
    }

    #joystick-zone.active #joystick-stick {
      background: rgba(255, 255, 255, 0.28);
      border-color: rgba(255, 255, 255, 0.75);
    }

    #action-controls {
      position: absolute;

      right: max(24px, env(safe-area-inset-right));
      bottom: max(24px, env(safe-area-inset-bottom));

      display: flex;
      align-items: flex-end;

      gap: clamp(14px, 1.8vw, 24px);

      pointer-events: auto;
    }

    .action-button {
      width: clamp(64px, 7.8vw, 94px);
      height: clamp(64px, 7.8vw, 94px);

      display: flex;
      align-items: center;
      justify-content: center;

      border: 3px solid rgba(255, 255, 255, 0.42);
      border-radius: 50%;

      background: rgba(8, 11, 18, 0.55);
      color: #ffffff;

      font-size: clamp(17px, 2vw, 25px);
      font-weight: 700;

      box-shadow:
        0 7px 20px rgba(0, 0, 0, 0.3);

      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);

      touch-action: none;
    }

    .action-button.active {
      transform: scale(0.9);

      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.8);
    }

    #jump-button {
      margin-bottom: clamp(32px, 4vw, 54px);
    }

    @media (hover: hover) and (pointer: fine) {
      #touch-controls {
        display: none;
      }
    }

    @media (hover: none), (pointer: coarse) {
      #desktop-help,
      #keyboard-settings {
        display: none;
      }
    }

    @media (max-width: 900px) {
      #desktop-help,
      #keyboard-settings {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .orientation-content,
      .phone-rotate-icon,
      #loading-page::before,
      #progress-bar::after {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main id="game-wrapper">
    <canvas
      id="game-canvas"
      width="1280"
      height="720"
      tabindex="0"
    ></canvas>

    <section
      id="orientation-screen"
      aria-label="請旋轉手機"
    >
      <div class="orientation-content">
        <div
          class="phone-rotate-icon"
          aria-hidden="true"
        ></div>

        <div>
          <div class="orientation-title">
            請將手機轉為橫向
          </div>

          <div class="orientation-subtitle">
            橫向模式可獲得最佳遊戲體驗
          </div>
        </div>
      </div>
    </section>

    <section
      id="loading-page"
      aria-label="遊戲載入畫面"
    >
      <div class="loading-content">
        <div class="game-logo">
          <span class="logo-main">
            HOODED
          </span>

          <span class="logo-sub">
            ESCAPE
          </span>
        </div>

        <div id="loading-status">
          <div class="loading-text">
            <span id="loading-message">
              正在確認地下城入口……
            </span>

            <span id="progress-number">
              0%
            </span>
          </div>

          <div id="progress-track">
            <div id="progress-bar"></div>
          </div>
        </div>

        <button
          id="enter-dungeon-button"
          type="button"
        >
          進入地下城
        </button>
      </div>
    </section>

    <section
      id="stage-intro"
      aria-label="關卡開始"
    >
      <div id="stage-intro-title">
        STAGE 1
      </div>
    </section>

    <section
      id="fail-screen"
      aria-label="挑戰失敗"
    >
      <div id="fail-title">
        FAIL !!!
      </div>

      <button
        id="respawn-button"
        type="button"
      >
        重生
      </button>
    </section>

    <div id="desktop-help">
      A／D 或方向鍵移動｜W／空白鍵跳躍｜S 蹲下｜Shift 跑步｜攻擊：
      <span id="attack-key-label">Z</span>
    </div>

    <div id="keyboard-settings">
      <label for="attack-key-select">
        攻擊鍵
      </label>

      <select id="attack-key-select">
        <option value="KeyZ">Z</option>
        <option value="KeyX">X</option>
        <option value="KeyC">C</option>
        <option value="KeyV">V</option>
        <option value="KeyJ">J</option>
        <option value="KeyK">K</option>
        <option value="KeyL">L</option>
      </select>
    </div>

    <div id="touch-controls">
      <div id="joystick-zone">
        <div id="joystick-base">
          <div id="joystick-stick"></div>
        </div>
      </div>

      <div id="action-controls">
        <button
          class="action-button"
          type="button"
          data-control="attack"
          aria-label="攻擊"
        >
          攻
        </button>

        <button
          id="jump-button"
          class="action-button"
          type="button"
          data-control="jump"
          aria-label="跳躍"
        >
          跳
        </button>
      </div>
    </div>
  </main>

  <script>
    "use strict";

    /* ==================================================
       DOM
    ================================================== */

    const canvas =
      document.getElementById("game-canvas");

    const context =
      canvas.getContext("2d");

    const orientationScreen =
      document.getElementById("orientation-screen");

    const loadingPage =
      document.getElementById("loading-page");

    const loadingStatus =
      document.getElementById("loading-status");

    const loadingMessage =
      document.getElementById("loading-message");

    const progressBar =
      document.getElementById("progress-bar");

    const progressNumber =
      document.getElementById("progress-number");

    const enterDungeonButton =
      document.getElementById("enter-dungeon-button");

    const stageIntro =
      document.getElementById("stage-intro");

    const stageIntroTitle =
      document.getElementById("stage-intro-title");

    const failScreen =
      document.getElementById("fail-screen");

    const respawnButton =
      document.getElementById("respawn-button");

    const attackKeySelect =
      document.getElementById("attack-key-select");

    const attackKeyLabel =
      document.getElementById("attack-key-label");

    const joystickZone =
      document.getElementById("joystick-zone");

    const joystickBase =
      document.getElementById("joystick-base");

    const joystickStick =
      document.getElementById("joystick-stick");

    context.imageSmoothingEnabled = false;

    /* ==================================================
       世界設定
    ================================================== */

    const VIEW_WIDTH = 1280;
    const VIEW_HEIGHT = 720;

    const WORLD_WIDTH = 2560;
    const WORLD_HEIGHT = 1440;

    const WORLD_GROUND_Y = 1240;

    const GRAVITY = 2200;
    const WALK_SPEED = 230;
    const RUN_SPEED = 420;
    const JUMP_FORCE = 820;

    const PLAYER_SCALE = 2.6;
    const ENEMY_SCALE = 2.3;

    const CAMERA_FOLLOW_SPEED = 5.5;

    const JOYSTICK_DEAD_ZONE = 0.14;
    const RUN_THRESHOLD = 0.72;
    const DUCK_THRESHOLD = 0.62;

    const ORIENTATION_FADE_TIME = 650;

    const STAGE_INTRO_HOLD_TIME = 500;
    const STAGE_INTRO_FADE_TIME = 500;
    const LOADING_PAGE_FADE_TIME = 850;

    /* ==================================================
       V0.6 戰鬥設定
    ================================================== */

    ================================================== */

    function loadImage(path) {
      return new Promise(
        (resolve, reject) => {
          const image = new Image();

          image.onload = () => {
            resolve(image);
          };

          image.onerror = () => {
            reject(
              new Error(
                `無法載入圖片：${path}`
              )
            );
          };

          image.src = path;
        }
      );
    }

    function calculateSpriteFootOffset(image) {
      const scanCanvas =
        document.createElement("canvas");

      scanCanvas.width =
        image.naturalWidth ||
        image.width;

      scanCanvas.height =
        image.naturalHeight ||
        image.height;

      const scanContext =
        scanCanvas.getContext(
          "2d",
          {
            willReadFrequently: true
          }
        );

      if (!scanContext) {
        return 0;
      }

      scanContext.clearRect(
        0,
        0,
        scanCanvas.width,
        scanCanvas.height
      );

      scanContext.drawImage(
        image,
        0,
        0
      );

      let imageData;

      try {
        imageData =
          scanContext.getImageData(
            0,
            0,
            scanCanvas.width,
            scanCanvas.height
          );
      } catch (error) {
        console.warn(
          "無法分析 Sprite Anchor：",
          error
        );

        return 0;
      }

      /*
        僅掃描圖片中央區域，
        避免武器被誤認為腳底。
      */
      const startX =
        Math.floor(
          scanCanvas.width *
          0.3
        );

      const endX =
        Math.ceil(
          scanCanvas.width *
          0.7
        );

      let lowestOpaqueY = -1;

      for (
        let y =
          scanCanvas.height - 1;
        y >= 0;
        y -= 1
      ) {
        let foundOpaquePixel = false;

        for (
          let x = startX;
          x < endX;
          x += 1
        ) {
          const alphaIndex =
            (
              y *
              scanCanvas.width +
              x
            ) *
              4 +
            3;

          if (
            imageData.data[
              alphaIndex
            ] > 20
          ) {
            foundOpaquePixel = true;
            break;
          }
        }

        if (foundOpaquePixel) {
          lowestOpaqueY = y;
          break;
        }
      }

      if (lowestOpaqueY < 0) {
        return 0;
      }

      return (
        scanCanvas.height -
        1 -
        lowestOpaqueY
      );
    }

    async function loadAnimationGroup(
      destination,
      definitions,
      basePath,
      analyzeFootOffsets = false
    ) {
      const tasks = [];

      for (
        const [
          animationName,
          definition
        ] of Object.entries(definitions)
      ) {
        destination[
          animationName
        ] = {
          frames: [],
          footOffsets: [],

          frameDuration:
            definition.frameDuration,

          loop:
            definition.loop
        };

        for (
          let frameNumber = 1;
          frameNumber <=
            definition.frameCount;
          frameNumber += 1
        ) {
          const path =
            basePath +
            "/" +
            definition.folder +
            "/" +
            definition.prefix +
            padNumber(frameNumber) +
            ".png";

          tasks.push(
            loadImage(path).then(
              (image) => {
                const frameIndex =
                  frameNumber - 1;

                destination[
                  animationName
                ].frames[
                  frameIndex
                ] = image;

                destination[
                  animationName
                ].footOffsets[
                  frameIndex
                ] =
                  analyzeFootOffsets
                    ? calculateSpriteFootOffset(
                        image
                      )
                    : 0;
              }
            )
          );
        }
      }

      await Promise.all(tasks);
    }

    function setLoadingProgress(
      progress,
      message
    ) {
      const safeProgress =
        clamp(progress, 0, 100);

      progressBar.style.width =
        `${safeProgress}%`;

      progressNumber.textContent =
        `${Math.floor(
          safeProgress
        )}%`;

      if (message) {
        loadingMessage.textContent =
          message;
      }
    }

    function animateProgress(
      start,
      end,
      duration,
      message
    ) {
      return new Promise((resolve) => {
        const startTime =
          performance.now();

        function update(currentTime) {
          const elapsed =
            currentTime - startTime;

          const ratio =
            Math.min(
              elapsed / duration,
              1
            );

          const easedRatio =
            1 -
            Math.pow(
              1 - ratio,
              2
            );

          const progress =
            start +
            (
              end - start
            ) *
            easedRatio;

          setLoadingProgress(
            progress,
            message
          );

          if (ratio < 1) {
            requestAnimationFrame(
              update
            );
          } else {
            resolve();
          }
        }

        requestAnimationFrame(
          update
        );
      });
    }

    function setPlayerAnimation(
      animationName,
      restart = false
    ) {
      if (
        !playerAnimations[
          animationName
        ]
      ) {
        return;
      }

      if (
        player.animation !==
          animationName ||
        restart
      ) {
        player.animation =
          animationName;

        player.frameIndex = 0;
        player.frameTimer = 0;

        if (
          animationName ===
          "attack"
        ) {
          player.attackHitRegistered =
            false;
        }
      }
    }

    function completePlayerAttack() {
      player.attacking = false;
      player.airAttacking = false;

      if (player.grounded) {
        setPlayerAnimation(
          "idle",
          true
        );
      } else {
        setPlayerAnimation(
          "jump",
          true
        );
      }
    }

    function updatePlayerAnimation(
      deltaTime
    ) {
      const animation =
        playerAnimations[
          player.animation
        ];

      if (
        !animation ||
        animation.frames.length === 0
      ) {
        return;
      }

      if (
        player.animation ===
        "jump"
      ) {
        const lastFrame =
          animation.frames.length - 1;

        if (
          player.velocityY < -520
        ) {
          player.frameIndex =
            Math.min(
              1,
              lastFrame
            );
        } else if (
          player.velocityY < -260
        ) {
          player.frameIndex =
            Math.min(
              2,
              lastFrame
            );
        } else if (
          player.velocityY < -60
        ) {
          player.frameIndex =
            Math.min(
              3,
              lastFrame
            );
        } else if (
          player.velocityY < 160
        ) {
          player.frameIndex =
            Math.min(
              4,
              lastFrame
            );
        } else if (
          player.velocityY < 380
        ) {
          player.frameIndex =
            Math.min(
              5,
              lastFrame
            );
        } else if (
          player.velocityY < 620
        ) {
          player.frameIndex =
            Math.min(
              6,
              lastFrame
            );
        } else {
          player.frameIndex =
            Math.min(
              7,
              lastFrame
            );
        }

        return;
      }

      player.frameTimer +=
        deltaTime;

      while (
        player.frameTimer >=
        animation.frameDuration
      ) {
        player.frameTimer -=
          animation.frameDuration;

        player.frameIndex += 1;

        if (
          player.frameIndex >=
          animation.frames.length
        ) {
          if (animation.loop) {
            player.frameIndex = 0;
          } else {
            player.frameIndex =
              animation.frames.length -
              1;

            if (
              player.animation ===
              "attack"
            ) {
              completePlayerAttack();
            }
          }
        }
      }
    }

    function getPlayerHurtbox() {
      const width = 42;
      const height =
        player.ducking
          ? 48
          : 72;

      return {
        x: player.x -
          width / 2,
        y: player.y -
          height,
        width,
        height
      };
    }

    function getPlayerAttackHitbox() {
      if (
        !player.attacking ||
        player.animation !==
          "attack" ||
        player.frameIndex <
          PLAYER_ATTACK_ACTIVE_START ||
        player.frameIndex >
          PLAYER_ATTACK_ACTIVE_END
      ) {
        return null;
      }

      const width = 70;
      const height = 58;
      const offset = 38;

      return {
        x:
          player.facing === 1
            ? player.x +
              offset
            : player.x -
              offset -
              width,
        y:
          player.y -
          height -
          8,
        width,
        height
      };
    }

    function getOrcHurtbox() {
      const width = 72;
      const height = 105;

      return {
        x: orc.x -
          width / 2,
        y: orc.y -
          height,

        height
      };

    function getOrcAttackHitbox() {
      if (
        orc.dead ||
        !orc.attacking ||
        orc.animation !==
          "attack" ||
        orc.frameIndex <
          ORC_ATTACK_ACTIVE_START ||
        orc.frameIndex >
          ORC_ATTACK_ACTIVE_END
      ) {
        return null;
      }

      const width = 86;
      const height = 75;
      const offset = 42;

      return {
        x:
          orc.facing === 1
            ? orc.x +
              offset
            : orc.x -
              offset -
              width,
        y:
          orc.y -
          height -
          4,
        width,
        height
      };
    }

    function damagePlayer(amount) {
      if (
        gameFailed ||
        player.invincibleTimer > 0 ||
        player.hp <= 0
      ) {
        return;
      }

      player.hp = Math.max(
        0,
        player.hp - amount
      );

      player.invincibleTimer =
        PLAYER_INVINCIBLE_TIME;

      if (player.hp <= 0) {
        triggerFail();
      }
    }

    function damageOrc(amount) {
      if (
        orc.dead ||
        orc.hp <= 0
      ) {
        return;
      }

      orc.hp = Math.max(
        0,
        orc.hp - amount
      );

      if (orc.hp <= 0) {
        orc.dead = true;
        orc.attacking = false;
        orc.velocityX = 0;
        orc.state = "dead";
        orc.fadeTimer = 0;
      }
    }

    function applyBodyContact() {
      if (
        orc.dead ||
        gameFailed
      ) {
        return;
      }

      const playerHurtbox =
        getPlayerHurtbox();

      const orcHurtbox =
        getOrcHurtbox();

      if (
        !rectanglesIntersect(
          playerHurtbox,
          orcHurtbox
        )
      ) {
        return;
      }

      const playerDirection =
        player.x < orc.x
          ? -1
          : 1;

      player.x = clamp(
        player.x +
          playerDirection *
          BODY_KNOCKBACK_DISTANCE,
        52,
        WORLD_WIDTH - 52
      );

      if (
        player.level >
        orc.level
      ) {
        orc.x = clamp(
          orc.x -
            playerDirection *
            BODY_KNOCKBACK_DISTANCE,
          80,
          WORLD_WIDTH - 80
        );
      }

      damagePlayer(
        BODY_CONTACT_DAMAGE
      );
    }

    function resolveCombat() {
      if (
        !gameStarted ||
        !playerControlEnabled ||
        gameFailed ||
        orc.dead
      ) {
        return;
      }

      const playerAttackHitbox =
        getPlayerAttackHitbox();

      if (
        playerAttackHitbox &&
        !player.attackHitRegistered &&
        rectanglesIntersect(
          playerAttackHitbox,
          getOrcHurtbox()
        )
      ) {
        player.attackHitRegistered =
          true;

        damageOrc(
          PLAYER_ATTACK_DAMAGE
        );
      }

      const orcAttackHitbox =
        getOrcAttackHitbox();

      if (
        orcAttackHitbox &&
        !orc.attackHitRegistered &&
        rectanglesIntersect(
          orcAttackHitbox,
          getPlayerHurtbox()
        )
      ) {
        orc.attackHitRegistered =
          true;

        damagePlayer(
          ORC_ATTACK_DAMAGE
        );
      }

      applyBodyContact();
    }

    /* ==================================================
       玩家控制
    ================================================== */

    function triggerJump() {
      if (
        !gameStarted ||
        !playerControlEnabled ||
        !player.grounded ||
        player.attacking ||
        player.ducking
      ) {
        return;
      }

      player.grounded = false;
      player.ducking = false;

      player.velocityY =
        -JUMP_FORCE;

      setPlayerAnimation(
        "jump",
        true
      );
    }

    function triggerPlayerAttack() {
      if (
        !gameStarted ||
        !playerControlEnabled ||
        player.attacking ||
        player.ducking
      ) {
        return;
      }

      player.attacking = true;

      if (player.grounded) {
        player.airAttacking = false;
        player.velocityX = 0;
      } else {
        player.airAttacking = true;
      }

      setPlayerAnimation(
        "attack",
        true
      );
    }

    function updatePlayer(
      deltaTime
    ) {
      if (!gameStarted) {
        if (assetsLoaded) {
          updatePlayerAnimation(
            deltaTime
          );
        }

        return;
      }

      /*
        Stage Intro 期間：
        玩家固定保持 Idle，不能移動或攻擊。
      */
      if (
        !playerControlEnabled ||
        gameFailed
      ) {
        player.velocityX = 0;
        player.velocityY = 0;

        player.y =
          WORLD_GROUND_Y;

        player.grounded = true;
        player.ducking = false;
        player.attacking = false;
        player.airAttacking = false;

        pressed.jump = false;
        pressed.attack = false;

        setPlayerAnimation(
          "idle"
        );

        updatePlayerAnimation(
          deltaTime
        );

        return;
      }

      if (
        player.invincibleTimer > 0
      ) {
        player.invincibleTimer =
          Math.max(
            0,
            player.invincibleTimer -
              deltaTime
          );
      }

      if (pressed.jump) {
        triggerJump();

        pressed.jump = false;
      }

      if (pressed.attack) {
        triggerPlayerAttack();

        pressed.attack = false;
      }

      let horizontalDirection =
        Number(input.right) -
        Number(input.left);

      let analogStrength =
        Math.abs(
          horizontalDirection
        );

      if (joystick.active) {
        horizontalDirection =
          joystick.x;

        analogStrength =
          joystick.magnitude;
      }

      const joystickDucking =
        joystick.active &&
        joystick.y >
          DUCK_THRESHOLD &&
        Math.abs(
          joystick.x
        ) < 0.55;

      player.ducking =
        (
          input.duck ||
          joystickDucking
        ) &&
        player.grounded &&
        !player.attacking;

      if (
        !player.attacking &&
        !player.ducking
      ) {
        if (
          Math.abs(
            horizontalDirection
          ) >
          JOYSTICK_DEAD_ZONE
        ) {
          const shouldRun =
            input.run ||
            analogStrength >=
              RUN_THRESHOLD;

          const movementSpeed =
            shouldRun
              ? RUN_SPEED
              : WALK_SPEED;

          player.velocityX =
            horizontalDirection *
            movementSpeed;

          player.facing =
            horizontalDirection > 0
              ? 1
              : -1;

          if (player.grounded) {
            setPlayerAnimation(
              shouldRun
                ? "run"
                : "walk"
            );
          }
        } else {
          player.velocityX = 0;

          if (player.grounded) {
            setPlayerAnimation(
              "idle"
            );
          }
        }
      } else {
        if (
          !player.airAttacking
        ) {
          player.velocityX = 0;
        }

        if (player.ducking) {
          setPlayerAnimation(
            "duck"
          );
        }
      }

      if (!player.grounded) {
        player.velocityY +=
          GRAVITY *
          deltaTime;

        if (
          !player.airAttacking
        ) {
          setPlayerAnimation(
            "jump"
          );
        }
      }

      player.x +=
        player.velocityX *
        deltaTime;

      player.y +=
        player.velocityY *
        deltaTime;

      player.x = clamp(
        player.x,
        52,
        WORLD_WIDTH - 52
      );

      if (
        player.y >=
        WORLD_GROUND_Y
      ) {
        const wasAirborne =
          !player.grounded;

        player.y =
          WORLD_GROUND_Y;

        player.velocityY = 0;
        player.grounded = true;

        if (
          wasAirborne &&
          !player.attacking
        ) {
          player.airAttacking =
            false;

          setPlayerAnimation(
            "idle",
            true
          );
        }
      }

      if (player.y < 100) {
        player.y = 100;

        if (
          player.velocityY < 0
        ) {
          player.velocityY = 0;
        }
      }

      updatePlayerAnimation(
        deltaTime
      );
    }

    /* ==================================================
       ORC AI
    ================================================== */

    function startOrcAttack() {
      if (
        orc.dead ||
        orc.attacking ||
        orc.attackCooldown > 0
      ) {
        return;
      }

      orc.attacking = true;
      orc.state = "attack";
      orc.velocityX = 0;

      orc.facing =
        player.x >= orc.x
          ? 1
          : -1;

      setOrcAnimation(
        "attack",
        true
      );
    }

    function updateOrc(
      deltaTime
    ) {
      if (!gameStarted) {
        if (assetsLoaded) {
          updateOrcAnimation(
            deltaTime
          );
        }

        return;
      }

      if (orc.dead) {
        orc.fadeTimer +=
          deltaTime;

        orc.opacity = clamp(
          1 -
            orc.fadeTimer /
              ORC_FADE_DURATION,
          0,
          1
        );

        return;
      }

      /*
        Stage Intro 期間敵人保持 Idle，
        不提前靠近或攻擊玩家。
      */
      if (
        !playerControlEnabled ||
        gameFailed
      ) {
        orc.velocityX = 0;
        orc.attacking = false;
        orc.state = "patrol";

        setOrcAnimation(
          "idle"
        );

        updateOrcAnimation(
          deltaTime
        );

        return;
      }

      if (
        orc.attackCooldown > 0
      ) {
        orc.attackCooldown =
          Math.max(
            0,
            orc.attackCooldown -
              deltaTime
          );
      }

      if (orc.attacking) {
        orc.velocityX = 0;

        updateOrcAnimation(
          deltaTime
        );

        return;
      }

      const differenceX =
        player.x - orc.x;

      const distanceX =
        Math.abs(
          differenceX
        );

      if (
        distanceX <=
        ORC_ATTACK_RANGE
      ) {
        orc.state = "attack";
        orc.velocityX = 0;

        orc.facing =
          differenceX >= 0
            ? 1
            : -1;

        if (
          orc.attackCooldown <= 0
        ) {
          startOrcAttack();
        } else {
          setOrcAnimation(
            "idle"
          );
        }
      } else if (
        distanceX <=
        ORC_DETECTION_RANGE
      ) {
        orc.state = "chase";

        const direction =
          differenceX >= 0
            ? 1
            : -1;

        orc.facing =
          direction;

        orc.velocityX =
          direction *
          ORC_CHASE_SPEED;

        setOrcAnimation(
          "walk"
        );
      } else {
        orc.state = "patrol";

        if (
          orc.patrolWaitTimer > 0
        ) {
          orc.patrolWaitTimer =
            Math.max(
              0,
              orc.patrolWaitTimer -
                deltaTime
            );

          orc.velocityX = 0;

          setOrcAnimation(
            "idle"
          );
        } else {
          orc.velocityX =
            orc.patrolDirection *
            ORC_PATROL_SPEED;

          orc.facing =
            orc.patrolDirection;

          setOrcAnimation(
            "walk"
          );
        }
      }

      orc.x +=
        orc.velocityX *
        deltaTime;

      if (
        orc.state ===
        "patrol"
      ) {
        if (
          orc.x <=
          orc.patrolMinX
        ) {
          orc.x =
            orc.patrolMinX;

          orc.patrolDirection = 1;

          orc.patrolWaitTimer =
            ORC_PATROL_WAIT_TIME;

          orc.velocityX = 0;

          setOrcAnimation(
            "idle",
            true
          );
        } else if (
          orc.x >=
          orc.patrolMaxX
        ) {
          orc.x =
            orc.patrolMaxX;

          orc.patrolDirection = -1;

          orc.patrolWaitTimer =
            ORC_PATROL_WAIT_TIME;

          orc.velocityX = 0;

          setOrcAnimation(
            "idle",
            true
          );
        }
      }

      orc.x = clamp(
        orc.x,
        80,
        WORLD_WIDTH - 80
      );

      updateOrcAnimation(
        deltaTime
      );
    }

    /* ==================================================
       FAIL 與重生
    ================================================== */

    function triggerFail() {
      if (gameFailed) {
        return;
      }

      gameFailed = true;
      playerControlEnabled = false;

      document.body.classList.remove(
        "player-control-enabled"
      );

      resetAllInputs();

      orc.velocityX = 0;
      orc.attacking = false;

      failScreen.classList.add(
        "visible"
      );
    }

    async function respawnGame() {
      failScreen.classList.remove(
        "visible"
      );

      gameFailed = false;
      playerControlEnabled = false;

      document.body.classList.remove(
        "player-control-enabled"
      );

      resetAllInputs();

      player.x =
        player.spawnX;
      player.y =
        WORLD_GROUND_Y;
      player.velocityX = 0;
      player.velocityY = 0;
      player.facing = 1;
      player.grounded = true;
      player.ducking = false;
      player.attacking = false;
      player.airAttacking = false;
      player.hp =
        player.maxHp;
      player.invincibleTimer = 0;
      player.attackHitRegistered =
        false;

      setPlayerAnimation(
        "idle",
        true
      );

      orc.x =
        orc.spawnX;
      orc.y =
        WORLD_GROUND_Y;
      orc.velocityX = 0;
      orc.facing = -1;
      orc.state = "patrol";
      orc.attacking = false;
      orc.attackCooldown = 0;
      orc.patrolDirection = -1;
      orc.patrolWaitTimer = 0;
      orc.hp =
        orc.maxHp;
      orc.attackHitRegistered =
        false;
      orc.dead = false;
      orc.opacity = 1;
      orc.fadeTimer = 0;

      setOrcAnimation(
        "idle",
        true
      );

      snapCameraToPlayer();

      await playStageIntro();
    }

    respawnButton.addEventListener(
      "click",
      respawnGame
    );

    /* ==================================================
       相機
    ================================================== */

    function calculateCameraTarget() {
      const horizontalAnchor =
        VIEW_WIDTH * 0.42;

      const verticalAnchor =
        VIEW_HEIGHT * 0.58;

      camera.targetX =
        player.x -
        horizontalAnchor;

      camera.targetY =
        player.y -
        verticalAnchor;

      camera.targetX = clamp(
        camera.targetX,
        0,
        WORLD_WIDTH -
          VIEW_WIDTH
      );

      camera.targetY = clamp(
        camera.targetY,
        0,
        WORLD_HEIGHT -
          VIEW_HEIGHT
      );
    }

    function snapCameraToPlayer() {
      calculateCameraTarget();

      camera.x =
        camera.targetX;

      camera.y =
        camera.targetY;
    }

    function updateCamera(
      deltaTime
    ) {
      calculateCameraTarget();

      const smoothing =
        1 -
        Math.exp(
          -CAMERA_FOLLOW_SPEED *
          deltaTime
        );

      camera.x +=
        (
          camera.targetX -
          camera.x
        ) *
        smoothing;

      camera.y +=
        (
          camera.targetY -
          camera.y
        ) *
        smoothing;

      camera.x = clamp(
        camera.x,
        0,
        WORLD_WIDTH -
          VIEW_WIDTH
      );

      camera.y = clamp(
        camera.y,
        0,
        WORLD_HEIGHT -
          VIEW_HEIGHT
      );
    }

    /* ==================================================
       世界繪製
    ================================================== */

    function drawBackground() {
      const gradient =
        context.createLinearGradient(
          0,
          0,
          0,
          VIEW_HEIGHT
        );

      gradient.addColorStop(
        0,
        "#252e40"
      );

      gradient.addColorStop(
        1,
        "#111722"
      );

      context.fillStyle =
        gradient;

      context.fillRect(
        0,
        0,
        VIEW_WIDTH,
        VIEW_HEIGHT
      );
    }

    function drawDungeonWalls() {
      const tileSize = 96;

      const startColumn =
        Math.floor(
          camera.x /
          tileSize
        );

      const endColumn =
        Math.ceil(
          (
            camera.x +
            VIEW_WIDTH
          ) /
          tileSize
        );

      const startRow =
        Math.floor(
          camera.y /
          tileSize
        );

      const endRow =
        Math.ceil(
          (
            camera.y +
            VIEW_HEIGHT
          ) /
          tileSize
        );

      for (
        let row = startRow;
        row <= endRow;
        row += 1
      ) {
        for (
          let column =
            startColumn;
          column <= endColumn;
          column += 1
        ) {
          const worldX =
            column *
            tileSize;

          const worldY =
            row *
            tileSize;

          const screenX =
            worldToScreenX(
              worldX
            );

          const screenY =
            worldToScreenY(
              worldY
            );

          const alternate =
            (
              row +
              column
            ) %
              2 ===
            0;

          context.fillStyle =
            alternate
              ? "rgba(255,255,255,0.018)"
              : "rgba(0,0,0,0.025)";

          context.fillRect(
            Math.floor(
              screenX
            ),
            Math.floor(
              screenY
            ),
            tileSize + 1,
            tileSize + 1
          );

          context.strokeStyle =
            "rgba(255,255,255,0.025)";

          context.strokeRect(
            Math.floor(
              screenX
            ),
            Math.floor(
              screenY
            ),
            tileSize,
            tileSize
          );
        }
      }
    }

        },

        );

          screenY,

        );

          screenX - 55,

          24
        );

          "rgba(255,255,255,0.045)";

        context.fillRect(
          screenX - 26,
          screenY + 34,
          12,
          235
        );
      }

      const torches = [
        {
          x: 520,
          y: 1040
        },
        {
          x: 980,
          y: 1040
        },
        {
          x: 1440,
          y: 1040
        },
        {
          x: 1900,
          y: 1040
        },
        {

        }
      ];

      for (

      ) {

          );

          );

        if (

          screenX >

        ) {

        }

    function drawGround() {
      const screenGroundY =
        worldToScreenY(
          WORLD_GROUND_Y
        );

      context.fillStyle =
        "#303846";

      context.fillRect(
        0,
        screenGroundY,
        VIEW_WIDTH,
        Math.max(
          0,
          VIEW_HEIGHT -
            screenGroundY
        )
      );

      context.fillStyle =
        "#697588";

      context.fillRect(
        0,
        screenGroundY,
        VIEW_WIDTH,
        5
      );

      const floorTileWidth = 84;

      const firstTile =
        Math.floor(
          camera.x /
          floorTileWidth
        );

      const lastTile =
        Math.ceil(
          (
            camera.x +
            VIEW_WIDTH
          ) /
          floorTileWidth
        );

      context.fillStyle =
        "rgba(255,255,255,0.06)";

      for (
        let tile = firstTile;
        tile <= lastTile;
        tile += 1
      ) {
        const worldX =
          tile *
          floorTileWidth;

        const screenX =
          worldToScreenX(
            worldX
          );

        context.fillRect(
          screenX,
          screenGroundY + 38,
          48,
          4
        );
      }
    }

    function drawEntityShadow(
      worldX,
      radiusX,
      radiusY
    ) {
      const screenX =
        worldToScreenX(
          worldX
        );

      const screenY =
        worldToScreenY(
          WORLD_GROUND_Y
        );

      context.save();

      context.globalAlpha =
        0.25;

      context.fillStyle =
        "#000000";

      context.beginPath();

      context.ellipse(
        screenX,
        screenY + 5,
        radiusX,
        radiusY,
        0,
        0,
        Math.PI * 2
      );

      context.fill();

      context.restore();
    }

    function drawPlayer() {
      const animation =
        playerAnimations[
          player.animation
        ];

      if (
        !animation ||
        animation.frames.length === 0
      ) {
        return;
      }

      const frame =
        animation.frames[
          Math.min(
            player.frameIndex,
            animation.frames.length -
              1
          )
        ];

      if (!frame) {
        return;
      }

      const drawWidth =
        frame.width *
        PLAYER_SCALE;

      const drawHeight =
        frame.height *
        PLAYER_SCALE;

      const screenX =
        worldToScreenX(
          player.x
        );

      const screenY =
        worldToScreenY(
          player.y
        );

      context.save();

      if (
        player.invincibleTimer > 0 &&
        Math.floor(
          player.invincibleTimer * 20
        ) % 2 === 0
      ) {
        context.globalAlpha = 0.4;
      }

      context.translate(
        Math.round(
          screenX
        ),
        Math.round(
          screenY
        )
      );

      context.scale(
        player.facing,
        1
      );

      context.drawImage(
        frame,
        Math.round(
          -drawWidth / 2
        ),
        Math.round(
          -drawHeight
        ),
        Math.round(
          drawWidth
        ),
        Math.round(
          drawHeight
        )
      );

      context.restore();
    }

    function getCurrentOrcFootOffset() {
      const animation =
        enemyAnimations[
          orc.animation
        ];

      if (
        !animation ||
        animation.footOffsets.length ===
          0
      ) {
        return 0;
      }

      const safeFrameIndex =
        Math.min(
          orc.frameIndex,
          animation.footOffsets
            .length -
            1
        );

      return (
        animation.footOffsets[
          safeFrameIndex
        ] ?? 0
      );
    }

    function drawOrc() {
      const animation =
        enemyAnimations[
          orc.animation
        ];

      if (
        !animation ||
        animation.frames.length === 0
      ) {
        return;
      }

      const safeFrameIndex =
        Math.min(
          orc.frameIndex,
          animation.frames.length -
            1
        );

      const frame =
        animation.frames[
          safeFrameIndex
        ];

      if (!frame) {
        return;
      }

      const screenX =
        worldToScreenX(
          orc.x
        );

      if (
        screenX <
          -ORC_DRAW_MARGIN ||
        screenX >
          VIEW_WIDTH +
            ORC_DRAW_MARGIN
      ) {
        return;
      }

      const sourceFootOffset =
        getCurrentOrcFootOffset();

      const footOffsetY =
        (
          sourceFootOffset +
          ORC_EXTRA_FOOT_OFFSET
        ) *
        ENEMY_SCALE;

      const screenY =
        worldToScreenY(
          orc.y
        ) +
        footOffsetY;

      const drawWidth =
        frame.width *
        ENEMY_SCALE;

      const drawHeight =
        frame.height *
        ENEMY_SCALE;

      context.save();

      context.globalAlpha =
        orc.opacity;

      context.translate(
        Math.round(
          screenX
        ),
        Math.round(
          screenY
        )
      );

      context.scale(
        -orc.facing,
        1
      );

      context.drawImage(
        frame,
        Math.round(
          -drawWidth / 2
        ),
        Math.round(
          -drawHeight
        ),
        Math.round(
          drawWidth
        ),
        Math.round(
          drawHeight
        )
      );

      context.restore();
    }

    function drawPlayerHealthBar() {
      const x = 22;
      const y = 22;
      const height = 22;

      const width =
        170 +
        (player.level - 1) *
          18;

      const ratio =
        player.maxHp > 0
          ? player.hp /
            player.maxHp
          : 0;

      context.save();

      context.fillStyle =
        "rgba(0,0,0,0.65)";

      context.fillRect(
        x - 8,
        y - 8,
        width + 16,
        54
      );

      context.fillStyle =
        "#ffffff";

      context.font =
        "bold 16px Arial, Microsoft JhengHei";

      context.fillText(
        `LV.${player.level}  HP ${player.hp} / ${player.maxHp}`,
        x,
        y + 15
      );

      context.fillStyle =
        "#2b2025";

      context.fillRect(
        x,
        y + 22,
        width,
        height
      );

      context.fillStyle =
        "#b84552";

      context.fillRect(
        x,
        y + 22,
        width * ratio,
        height
      );

      context.strokeStyle =
        "rgba(255,255,255,0.55)";

      context.strokeRect(
        x,
        y + 22,
        width,
        height
      );

      context.restore();
    }

    function drawOrcHealthBar() {
      if (
        orc.opacity <= 0 ||
        orc.dead
      ) {
        return;
      }

      const width = 96;
      const height = 9;

      const sourceFootOffset =
        getCurrentOrcFootOffset();

      const footOffsetY =
        (
          sourceFootOffset +
          ORC_EXTRA_FOOT_OFFSET
        ) *
        ENEMY_SCALE;

      const x =
        worldToScreenX(orc.x) -
        width / 2;

      const y =
        worldToScreenY(orc.y) +
        footOffsetY -
        64 * ENEMY_SCALE -
        4;

      const ratio =
        orc.maxHp > 0
          ? orc.hp /
            orc.maxHp
          : 0;

      context.save();
      context.globalAlpha =
        orc.opacity;

      context.fillStyle =
        "rgba(0,0,0,0.75)";

      context.fillRect(
        x - 1,
        y - 1,
        width + 2,
        height + 2
      );

      context.fillStyle =
        "#3c2024";

      context.fillRect(
        x,
        y,
        width,
        height
      );

      context.fillStyle =
        "#b84a54";

      context.fillRect(
        x,
        y,
        width * ratio,
        height
      );

      context.restore();
    }

    function drawDebugHud() {
      if (!gameStarted) {
        return;
      }

      const stateNames = {
        patrol: "巡邏",
        chase: "追蹤",
        attack: "攻擊"
      };

      context.save();

      context.fillStyle =
        "rgba(0,0,0,0.48)";

      context.fillRect(
        16,
        84,
        350,
        220
      );

      context.fillStyle =
        "#ffffff";

      context.font =
        "18px Arial, Microsoft JhengHei";

      context.fillText(
        `世界：${WORLD_WIDTH} × ${WORLD_HEIGHT}`,
        42,
        113
      );

      context.fillText(
        `玩家：${Math.round(
          player.x
        )}, ${Math.round(
          player.y
        )}`,
        42,
        139
      );

      context.fillText(
        `玩家動作：${player.animation}`,
        42,
        165
      );

      context.fillText(
        `空中攻擊：${
          player.airAttacking
            ? "是"
            : "否"
        }`,
        42,
        191
      );

      context.fillText(
        `玩家控制：${
          playerControlEnabled
            ? "開啟"
            : "鎖定"
        }`,
        42,
        217
      );

      context.fillText(
        `相機：${Math.round(
          camera.x
        )}, ${Math.round(
          camera.y
        )}`,
        42,
        243
      );

      context.fillText(
        `ORC1：${
          stateNames[
            orc.state
          ] || orc.state
        }`,
        42,
        269
      );

      context.fillText(
        `ORC Anchor：${
          getCurrentOrcFootOffset() +
          ORC_EXTRA_FOOT_OFFSET
        }px`,
        42,
        295
      );

      context.restore();
    }

    function render() {
      context.clearRect(
        0,
        0,
        VIEW_WIDTH,
        VIEW_HEIGHT
      );

      drawBackground();
      drawDungeonWalls();
      drawDungeonDecorations();
      drawGround();

      if (assetsLoaded) {
        if (orc.opacity > 0) {
          drawEntityShadow(
            orc.x,
            62,
            13
          );

          drawOrc();
          drawOrcHealthBar();
        }

        const playerHeight =
          Math.max(
            0,
            WORLD_GROUND_Y -
              player.y
          );

        const shadowScale =
          clamp(
            1 -
              playerHeight /
                700,
            0.45,
            1
          );

        drawEntityShadow(
          player.x,
          50 *
            shadowScale,
          12 *
            shadowScale
        );

        drawPlayer();
      }

      drawPlayerHealthBar();
      drawDebugHud();
    }

    /* ==================================================
       鍵盤輸入
    ================================================== */

    function getControlFromKey(code) {
      if (
        code === attackKeyCode
      ) {
        return "attack";
      }

      const keyBindings = {
        ArrowLeft: "left",
        KeyA: "left",

        ArrowRight: "right",
        KeyD: "right",

        ArrowUp: "jump",
        KeyW: "jump",
        Space: "jump",

        ArrowDown: "duck",
        KeyS: "duck",

        ShiftLeft: "run",
        ShiftRight: "run"
      };

      return (
        keyBindings[code] ||
        null
      );
    }

    function setControl(
      controlName,
      active,
      isNewPress = false
    ) {
      if (
        !(controlName in input)
      ) {
        return;
      }

      if (
        active &&
        isNewPress &&
        (
          controlName ===
            "jump" ||
          controlName ===
            "attack"
        )
      ) {
        pressed[
          controlName
        ] = true;
      }

      input[
        controlName
      ] = active;
    }

    window.addEventListener(
      "keydown",
      (event) => {
        if (
          !gameStarted ||
          !playerControlEnabled ||
          gameFailed ||
          document.activeElement ===
            attackKeySelect
        ) {
          return;
        }

        const controlName =
          getControlFromKey(
            event.code
          );

        if (!controlName) {
          return;
        }

        event.preventDefault();

        setControl(
          controlName,
          true,
          !input[
            controlName
          ]
        );
      }
    );

    window.addEventListener(
      "keyup",
      (event) => {
        const controlName =
          getControlFromKey(
            event.code
          );

        if (!controlName) {
          return;
        }

        event.preventDefault();

        setControl(
          controlName,
          false
        );
      }
    );

    /* ==================================================
       虛擬搖桿
    ================================================== */

    function updateJoystickCenter() {
      const rect =
        joystickBase.getBoundingClientRect();

      joystick.centerX =
        rect.left +
        rect.width / 2;

      joystick.centerY =
        rect.top +
        rect.height / 2;

      joystick.radius =
        rect.width * 0.34;
    }

    function updateJoystickPosition(
      clientX,
      clientY
    ) {
      const deltaX =
        clientX -
        joystick.centerX;

      const deltaY =
        clientY -
        joystick.centerY;

      const distance =
        Math.hypot(
          deltaX,
          deltaY
        );

      const limitedDistance =
        Math.min(
          distance,
          joystick.radius
        );

      const angle =
        Math.atan2(
          deltaY,
          deltaX
        );

      const visualX =
        Math.cos(
          angle
        ) *
        limitedDistance;

      const visualY =
        Math.sin(
          angle
        ) *
        limitedDistance;

      joystickStick.style.transform =
        `translate(
          calc(-50% + ${visualX}px),
          calc(-50% + ${visualY}px)
        )`;

      const normalizedX =
        joystick.radius > 0
          ? visualX /
            joystick.radius
          : 0;

      const normalizedY =
        joystick.radius > 0
          ? visualY /
            joystick.radius
          : 0;

      joystick.x =
        Math.abs(
          normalizedX
        ) <
        JOYSTICK_DEAD_ZONE
          ? 0
          : normalizedX;

      joystick.y =
        Math.abs(
          normalizedY
        ) <
        JOYSTICK_DEAD_ZONE
          ? 0
          : normalizedY;

      joystick.magnitude =
        Math.min(
          1,
          Math.hypot(
            joystick.x,
            joystick.y
          )
        );
    }

    function resetJoystick() {
      joystick.active = false;
      joystick.pointerId = null;

      joystick.x = 0;
      joystick.y = 0;
      joystick.magnitude = 0;

      joystickStick.style.transform =
        "translate(-50%, -50%)";

      joystickZone.classList.remove(
        "active"
      );
    }

    joystickZone.addEventListener(
      "pointerdown",
      (event) => {
        if (
          !gameStarted ||
          !playerControlEnabled ||
          gameFailed
        ) {
          return;
        }

        event.preventDefault();

        updateJoystickCenter();

        joystick.active = true;

        joystick.pointerId =
          event.pointerId;

        joystickZone.classList.add(
          "active"
        );

        if (
          joystickZone.setPointerCapture
        ) {
          joystickZone.setPointerCapture(
            event.pointerId
          );
        }

        updateJoystickPosition(
          event.clientX,
          event.clientY
        );
      }
    );

    joystickZone.addEventListener(
      "pointermove",
      (event) => {
        if (
          !gameStarted ||
          !playerControlEnabled ||
          !joystick.active ||
          event.pointerId !==
            joystick.pointerId
        ) {
          return;
        }

        event.preventDefault();

        updateJoystickPosition(
          event.clientX,
          event.clientY
        );
      }
    );

    joystickZone.addEventListener(
      "pointerup",
      resetJoystick
    );

    joystickZone.addEventListener(
      "pointercancel",
      resetJoystick
    );

    joystickZone.addEventListener(
      "lostpointercapture",
      resetJoystick
    );

    /* ==================================================
       手機按鈕
    ================================================== */

    document
      .querySelectorAll(
        ".action-button"
      )
      .forEach((button) => {
        const controlName =
          button.dataset.control;

        function activate(event) {
          if (
            !gameStarted ||
            !playerControlEnabled
          ) {
            return;
          }

          event.preventDefault();

          button.classList.add(
            "active"
          );

          setControl(
            controlName,
            true,
            !input[
              controlName
            ]
          );

          if (
            button.setPointerCapture
          ) {
            button.setPointerCapture(
              event.pointerId
            );
          }
        }

        function deactivate(event) {
          event.preventDefault();

          button.classList.remove(
            "active"
          );

          setControl(
            controlName,
            false
          );
        }

        button.addEventListener(
          "pointerdown",
          activate
        );

        button.addEventListener(
          "pointerup",
          deactivate
        );

        button.addEventListener(
          "pointercancel",
          deactivate
        );

        button.addEventListener(
          "lostpointercapture",
          deactivate
        );

        button.addEventListener(
          "contextmenu",
          (event) => {
            event.preventDefault();
          }
        );
      });

    /* ==================================================
       輸入重置
    ================================================== */

    function resetAllInputs() {
      for (
        const controlName of
        Object.keys(input)
      ) {
        input[
          controlName
        ] = false;
      }

      pressed.jump = false;
      pressed.attack = false;

      resetJoystick();

      document
        .querySelectorAll(
          ".action-button"
        )
        .forEach((button) => {
          button.classList.remove(
            "active"
          );
        });
    }

    window.addEventListener(
      "blur",
      resetAllInputs
    );

    document.addEventListener(
      "visibilitychange",
      () => {
        if (document.hidden) {
          resetAllInputs();
        }
      }
    );

    window.addEventListener(
      "resize",
      () => {
        handleOrientationState();

        window.setTimeout(
          () => {
            updateJoystickCenter();
          },
          100
        );
      }
    );

    window.addEventListener(
      "orientationchange",
      () => {
        resetAllInputs();

        window.setTimeout(
          () => {
            handleOrientationState();
            updateJoystickCenter();
          },
          250
        );
      }
    );

    /* ==================================================
       遊戲循環
    ================================================== */

    function gameLoop(
      currentTime
    ) {
      const rawDeltaTime =
        (
          currentTime -
          previousTime
        ) /
        1000;

      const deltaTime =
        Math.min(
          rawDeltaTime,
          1 / 30
        );

      previousTime =
        currentTime;

      updatePlayer(
        deltaTime
      );

      updateOrc(
        deltaTime
      );

      resolveCombat();

      if (gameStarted) {
        updateCamera(
          deltaTime
        );
      }

      render();

      requestAnimationFrame(
        gameLoop
      );
    }

    /* ==================================================
       初始化
    ================================================== */

    function initializeGame() {
      if (!gameLoopStarted) {
        gameLoopStarted = true;

        requestAnimationFrame(
          gameLoop
        );
      }

      if (
        isTouchDevice() &&
        isPortrait()
      ) {
        showOrientationScreen();
      } else {
        startLoadingSequence();
      }
    }

    initializeGame();
  </script>
</body>

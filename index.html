<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <title>Hooded Escape V0.6.2</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main id="game-wrapper">
    <canvas
      id="game-canvas"
      width="1280"
      height="720"
      tabindex="0"
    ></canvas>

    <section
      id="orientation-screen"
      aria-label="請旋轉手機"
    >
      <div class="orientation-content">
        <div
          class="phone-rotate-icon"
          aria-hidden="true"
        ></div>

        <div>
          <div class="orientation-title">
            請將手機轉為橫向
          </div>

          <div class="orientation-subtitle">
            橫向模式可獲得最佳遊戲體驗
          </div>
        </div>
      </div>
    </section>

    <section
      id="loading-page"
      aria-label="遊戲載入畫面"
    >
      <div class="loading-content">
        <div class="game-logo">
          <span class="logo-main">
            HOODED
          </span>

          <span class="logo-sub">
            ESCAPE
          </span>
        </div>

        <div id="loading-status">
          <div class="loading-text">
            <span id="loading-message">
              正在確認地下城入口……
            </span>

            <span id="progress-number">
              0%
            </span>
          </div>

          <div id="progress-track">
            <div id="progress-bar"></div>
          </div>
        </div>

        <button
          id="enter-dungeon-button"
          type="button"
        >
          進入地下城
        </button>
      </div>
    </section>

    <section
      id="stage-intro"
      aria-label="關卡開始"
    >
      <div id="stage-intro-title">
        STAGE 1
      </div>
    </section>

    <section
      id="fail-screen"
      aria-label="挑戰失敗"
    >
      <div id="fail-title">
        FAIL !!!
      </div>

      <button
        id="respawn-button"
        type="button"
      >
        重生
      </button>
    </section>

    <div id="desktop-help">
      A／D 或方向鍵移動｜W／空白鍵跳躍｜S 蹲下｜Shift 跑步｜攻擊：
      <span id="attack-key-label">Z</span>
    </div>

    <div id="keyboard-settings">
      <label for="attack-key-select">
        攻擊鍵
      </label>

      <select id="attack-key-select">
        <option value="KeyZ">Z</option>
        <option value="KeyX">X</option>
        <option value="KeyC">C</option>
        <option value="KeyV">V</option>
        <option value="KeyJ">J</option>
        <option value="KeyK">K</option>
        <option value="KeyL">L</option>
      </select>
    </div>

    <div id="touch-controls">
      <div id="joystick-zone">
        <div id="joystick-base">
          <div id="joystick-stick"></div>
        </div>
      </div>

      <div id="action-controls">
        <button
          class="action-button"
          type="button"
          data-control="attack"
          aria-label="攻擊"
        >
          攻
        </button>

        <button
          id="jump-button"
          class="action-button"
          type="button"
          data-control="jump"
          aria-label="跳躍"
        >
          跳
        </button>
      </div>
    </div>
  </main>


  <script src="js/config.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/input.js"></script>
  <script src="js/player.js"></script>
  <script src="js/orc.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/world.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>

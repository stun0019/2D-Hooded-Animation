<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <title>Hooded Escape</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #07090e;

      touch-action: none;
      overscroll-behavior: none;

      font-family:
        Arial,
        "Microsoft JhengHei",
        sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button,
    select {
      font: inherit;
    }

    /* ==================================================
       遊戲容器
    ================================================== */

    #game-wrapper {
      position: relative;

      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));

      max-width: 1280px;
      max-height: 720px;

      overflow: hidden;

      background: #111722;
    }

    #game-canvas {
      display: block;

      width: 100%;
      height: 100%;

      background: #111722;

      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* ==================================================
       手機直向提示
    ================================================== */

    #orientation-screen {
      position: absolute;
      inset: 0;
      z-index: 500;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at center,
          #171d2a 0%,
          #090c12 72%
        );

      color: #ffffff;

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition:
        opacity 0.65s ease,
        visibility 0.65s ease;
    }

    #orientation-screen.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #orientation-screen.fade-out {
      opacity: 0;
      visibility: visible;
      pointer-events: none;
    }

    .orientation-content {
      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 24px;
      padding: 30px;

      text-align: center;

      animation:
        orientationBreathe 2s ease-in-out infinite;
    }

    .phone-rotate-icon {
      position: relative;

      width: 74px;
      height: 122px;

      border: 4px solid rgba(255, 255, 255, 0.9);
      border-radius: 14px;

      transform: rotate(-18deg);

      animation:
        phoneRotate 2.2s ease-in-out infinite;
    }

    .phone-rotate-icon::before {
      content: "";

      position: absolute;
      left: 50%;
      bottom: 7px;

      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: rgba(255, 255, 255, 0.9);

      transform: translateX(-50%);
    }

    .phone-rotate-icon::after {
      content: "↻";

      position: absolute;
      top: 50%;
      left: 100%;

      margin-left: 20px;

      color: rgba(255, 255, 255, 0.85);

      font-size: 46px;

      transform: translateY(-50%);
    }

    .orientation-title {
      font-size: clamp(24px, 6vw, 38px);
      font-weight: 700;

      letter-spacing: 2px;
    }

    .orientation-subtitle {
      margin-top: 9px;

      color: rgba(255, 255, 255, 0.65);

      font-size: clamp(14px, 3.5vw, 18px);
      line-height: 1.6;
    }

    @keyframes orientationBreathe {
      0%,
      100% {
        opacity: 0.58;
        transform: scale(0.96);
      }

      50% {
        opacity: 1;
        transform: scale(1.04);
      }
    }

    @keyframes phoneRotate {
      0%,
      100% {
        transform: rotate(-18deg);
      }

      50% {
        transform: rotate(72deg);
      }
    }

    /* ==================================================
       Loading Page
    ================================================== */

    #loading-page {
      position: absolute;
      inset: 0;
      z-index: 400;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 42%,
          rgba(48, 58, 80, 0.62) 0%,
          rgba(14, 18, 28, 0.98) 48%,
          #07090e 100%
        );

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
    }

    #loading-page.prepared {
      visibility: visible;
    }

    #loading-page.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #loading-page.game-entered {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #loading-page::before {
      content: "";

      position: absolute;
      inset: 0;

      opacity: 0.12;

      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.04) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.04) 1px,
          transparent 1px
        );

      background-size: 48px 48px;

      animation:
        loadingGridMove 10s linear infinite;
    }

    #loading-page::after {
      content: "";

      position: absolute;
      left: 50%;
      bottom: -130px;

      width: 640px;
      height: 260px;

      border-radius: 50%;

      background:
        radial-gradient(
          ellipse,
          rgba(93, 111, 148, 0.25) 0%,
          transparent 70%
        );

      transform: translateX(-50%);
    }

    @keyframes loadingGridMove {
      from {
        background-position: 0 0;
      }

      to {
        background-position: 48px 48px;
      }
    }

    .loading-content {
      position: relative;
      z-index: 2;

      width: min(78%, 560px);

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;
    }

    .game-logo {
      margin-bottom: 50px;

      opacity: 0;

      transform: translateY(18px);
    }

    #loading-page.visible .game-logo {
      animation:
        logoFadeIn 0.9s 0.2s ease forwards;
    }

    .logo-main {
      display: block;

      color: #f4f5f7;

      font-size: clamp(42px, 7vw, 86px);
      font-weight: 900;

      letter-spacing: clamp(6px, 1.1vw, 14px);

      text-shadow:
        0 4px 0 rgba(0, 0, 0, 0.45),
        0 12px 28px rgba(0, 0, 0, 0.6);
    }

    .logo-sub {
      display: block;

      margin-top: 4px;

      color: rgba(199, 207, 225, 0.72);

      font-size: clamp(13px, 1.8vw, 22px);
      font-weight: 600;

      letter-spacing: clamp(8px, 1.5vw, 18px);
    }

    @keyframes logoFadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #loading-status {
      width: 100%;

      opacity: 1;
      transform: translateY(0);

      transition:
        opacity 0.4s ease,
        transform 0.4s ease;
    }

    #loading-status.hidden {
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
    }

    .loading-text {
      margin-bottom: 12px;

      display: flex;
      justify-content: space-between;

      gap: 18px;

      color: rgba(255, 255, 255, 0.78);

      font-size: clamp(13px, 1.8vw, 18px);
      letter-spacing: 1px;
    }

    #loading-message {
      text-align: left;
    }

    #progress-number {
      min-width: 48px;

      text-align: right;
    }

    #progress-track {
      position: relative;

      width: 100%;
      height: clamp(12px, 1.7vw, 18px);

      overflow: hidden;

      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;

      background: rgba(0, 0, 0, 0.36);
    }

    #progress-bar {
      position: relative;

      width: 0%;
      height: 100%;

      overflow: hidden;

      border-radius: inherit;

      background:
        linear-gradient(
          90deg,
          #6f7f9e,
          #b6c0d4,
          #7585a4
        );

      box-shadow:
        0 0 16px rgba(178, 193, 219, 0.38);

      transition:
        width 0.08s linear;
    }

    #progress-bar::after {
      content: "";

      position: absolute;
      inset: 0 auto 0 0;

      width: 120px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.55),
          transparent
        );

      animation:
        loadingShine 1.2s linear infinite;
    }

    @keyframes loadingShine {
      from {
        transform: translateX(-130px);
      }

      to {
        transform: translateX(600px);
      }
    }

    #enter-dungeon-button {
      position: absolute;
      top: calc(100% - 72px);

      min-width: 230px;

      padding: 15px 34px;

      border: 1px solid rgba(255, 255, 255, 0.42);
      border-radius: 7px;

      background:
        linear-gradient(
          180deg,
          rgba(104, 119, 149, 0.95),
          rgba(48, 58, 80, 0.98)
        );

      color: #ffffff;

      font-size: clamp(17px, 2.2vw, 24px);
      font-weight: 700;

      letter-spacing: 3px;

      cursor: pointer;

      opacity: 0;
      visibility: hidden;

      transform: translateY(16px);

      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.42);

      transition:
        opacity 0.65s ease,
        transform 0.65s ease,
        border-color 0.2s ease;
    }

    #enter-dungeon-button.visible {
      opacity: 1;
      visibility: visible;

      transform: translateY(0);
    }

    #enter-dungeon-button:hover {
      border-color: rgba(255, 255, 255, 0.8);
    }

    #enter-dungeon-button:active {
      transform: scale(0.96);
    }

    /* ==================================================
       電腦版 HUD
    ================================================== */

    #desktop-help {
      position: absolute;
      top: 18px;
      left: 50%;
      z-index: 20;

      transform: translateX(-50%);

      padding: 10px 18px;

      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;

      background: rgba(0, 0, 0, 0.42);
      color: rgba(255, 255, 255, 0.9);

      font-size: 15px;
      white-space: nowrap;

      opacity: 0;
      visibility: hidden;

      pointer-events: none;

      transition: opacity 0.4s ease;
    }

    #keyboard-settings {
      position: absolute;
      top: 22px;
      right: 24px;
      z-index: 25;

      display: flex;
      align-items: center;

      gap: 8px;

      padding: 8px 10px;

      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;

      background: rgba(0, 0, 0, 0.42);
      color: #ffffff;

      font-size: 14px;

      opacity: 0;
      visibility: hidden;

      transition: opacity 0.4s ease;
    }

    #attack-key-select {
      min-width: 58px;

      padding: 5px 8px;

      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 6px;

      background: #1a202b;
      color: #ffffff;
    }

    body.game-started #desktop-help,
    body.game-started #keyboard-settings {
      opacity: 1;
      visibility: visible;
    }

    /* ==================================================
       手機控制
    ================================================== */

    #touch-controls {
      position: absolute;
      inset: 0;
      z-index: 30;

      opacity: 0;
      visibility: hidden;

      pointer-events: none;

      transition:
        opacity 0.4s ease;
    }

    body.game-started #touch-controls {
      opacity: 1;
      visibility: visible;
    }

    #joystick-zone {
      position: absolute;

      left: max(24px, env(safe-area-inset-left));
      bottom: max(24px, env(safe-area-inset-bottom));

      width: clamp(120px, 15vw, 170px);
      height: clamp(120px, 15vw, 170px);

      display: flex;
      align-items: center;
      justify-content: center;

      pointer-events: auto;
      touch-action: none;
    }

    #joystick-base {
      position: relative;

      width: 100%;
      height: 100%;

      border: 3px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;

      background: rgba(8, 11, 18, 0.43);

      box-shadow:
        inset 0 0 28px rgba(255, 255, 255, 0.04),
        0 8px 20px rgba(0, 0, 0, 0.25);

      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    #joystick-base::before,
    #joystick-base::after {
      content: "";

      position: absolute;

      background: rgba(255, 255, 255, 0.1);

      pointer-events: none;
    }

    #joystick-base::before {
      top: 50%;
      left: 15%;
      right: 15%;

      height: 2px;

      transform: translateY(-50%);
    }

    #joystick-base::after {
      left: 50%;
      top: 15%;
      bottom: 15%;

      width: 2px;

      transform: translateX(-50%);
    }

    #joystick-stick {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 48%;
      height: 48%;

      border: 3px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;

      background: rgba(255, 255, 255, 0.17);

      transform: translate(-50%, -50%);

      box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.28);

      pointer-events: none;
    }

    #joystick-zone.active #joystick-stick {
      background: rgba(255, 255, 255, 0.28);
      border-color: rgba(255, 255, 255, 0.75);
    }

    #action-controls {
      position: absolute;

      right: max(24px, env(safe-area-inset-right));
      bottom: max(24px, env(safe-area-inset-bottom));

      display: flex;
      align-items: flex-end;

      gap: clamp(14px, 1.8vw, 24px);

      pointer-events: auto;
    }

    .action-button {
      width: clamp(64px, 7.8vw, 94px);
      height: clamp(64px, 7.8vw, 94px);

      display: flex;
      align-items: center;
      justify-content: center;

      border: 3px solid rgba(255, 255, 255, 0.42);
      border-radius: 50%;

      background: rgba(8, 11, 18, 0.55);
      color: #ffffff;

      font-size: clamp(17px, 2vw, 25px);
      font-weight: 700;

      box-shadow:
        0 7px 20px rgba(0, 0, 0, 0.3);

      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);

      touch-action: none;
    }

    .action-button.active {
      transform: scale(0.9);

      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.8);
    }

    #jump-button {
      margin-bottom: clamp(32px, 4vw, 54px);
    }

    @media (hover: hover) and (pointer: fine) {
      #touch-controls {
        display: none;
      }
    }

    @media (hover: none), (pointer: coarse) {
      #desktop-help,
      #keyboard-settings {
        display: none;
      }
    }

    @media (max-width: 900px) {
      #desktop-help,
      #keyboard-settings {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .orientation-content,
      .phone-rotate-icon,
      #loading-page::before,
      #progress-bar::after {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main id="game-wrapper">
    <canvas
      id="game-canvas"
      width="1280"
      height="720"
      tabindex="0"
    ></canvas>

    <section
      id="orientation-screen"
      aria-label="請旋轉手機"
    >
      <div class="orientation-content">
        <div
          class="phone-rotate-icon"
          aria-hidden="true"
        ></div>

        <div>
          <div class="orientation-title">
            請將手機轉為橫向
          </div>

          <div class="orientation-subtitle">
            橫向模式可獲得最佳遊戲體驗
          </div>
        </div>
      </div>
    </section>

    <section
      id="loading-page"
      aria-label="遊戲載入畫面"
    >
      <div class="loading-content">
        <div class="game-logo">
          <span class="logo-main">
            HOODED
          </span>

          <span class="logo-sub">
            ESCAPE
          </span>
        </div>

        <div id="loading-status">
          <div class="loading-text">
            <span id="loading-message">
              正在確認地下城入口……
            </span>

            <span id="progress-number">
              0%
            </span>
          </div>

          <div id="progress-track">
            <div id="progress-bar"></div>
          </div>
        </div>

        <button
          id="enter-dungeon-button"
          type="button"
        >
          進入地下城
        </button>
      </div>
    </section>

    <div id="desktop-help">
      A／D 或方向鍵移動｜W／空白鍵跳躍｜S 蹲下｜Shift 跑步｜攻擊：
      <span id="attack-key-label">Z</span>
    </div>

    <div id="keyboard-settings">
      <label for="attack-key-select">
        攻擊鍵
      </label>

      <select id="attack-key-select">
        <option value="KeyZ">Z</option>
        <option value="KeyX">X</option>
        <option value="KeyC">C</option>
        <option value="KeyV">V</option>
        <option value="KeyJ">J</option>
        <option value="KeyK">K</option>
        <option value="KeyL">L</option>
      </select>
    </div>

    <div id="touch-controls">
      <div id="joystick-zone">
        <div id="joystick-base">
          <div id="joystick-stick"></div>
        </div>
      </div>

      <div id="action-controls">
        <button
          class="action-button"
          type="button"
          data-control="attack"
        >
          攻
        </button>

        <button
          id="jump-button"
          class="action-button"
          type="button"
          data-control="jump"
        >
          跳
        </button>
      </div>
    </div>
  </main>

  <script>
    "use strict";

    /* ==================================================
       DOM
    ================================================== */

    const canvas =
      document.getElementById("game-canvas");

    const context =
      canvas.getContext("2d");

    const orientationScreen =
      document.getElementById("orientation-screen");

    const loadingPage =
      document.getElementById("loading-page");

    const loadingStatus =
      document.getElementById("loading-status");

    const loadingMessage =
      document.getElementById("loading-message");

    const progressBar =
      document.getElementById("progress-bar");

    const progressNumber =
      document.getElementById("progress-number");

    const enterDungeonButton =
      document.getElementById("enter-dungeon-button");

    const attackKeySelect =
      document.getElementById("attack-key-select");

    const attackKeyLabel =
      document.getElementById("attack-key-label");

    const joystickZone =
      document.getElementById("joystick-zone");

    const joystickBase =
      document.getElementById("joystick-base");

    const joystickStick =
      document.getElementById("joystick-stick");

    context.imageSmoothingEnabled = false;

    /* ==================================================
       畫面與世界
    ================================================== */

    const VIEW_WIDTH = 1280;
    const VIEW_HEIGHT = 720;

    const WORLD_WIDTH = 2560;
    const WORLD_HEIGHT = 1440;

    const WORLD_GROUND_Y = 1240;

    const GRAVITY = 2200;
    const WALK_SPEED = 230;
    const RUN_SPEED = 420;
    const JUMP_FORCE = 820;

    const PLAYER_SCALE = 2.6;
    const ENEMY_SCALE = 1.4;

    const CAMERA_FOLLOW_SPEED = 5.5;

    const JOYSTICK_DEAD_ZONE = 0.14;
    const RUN_THRESHOLD = 0.72;
    const DUCK_THRESHOLD = 0.62;

    const ORIENTATION_FADE_TIME = 650;

    /* ==================================================
       ORC1 AI 設定
    ================================================== */

    const ORC_PATROL_SPEED = 72;
    const ORC_CHASE_SPEED = 112;

    const ORC_DETECTION_RANGE = 390;
    const ORC_ATTACK_RANGE = 92;

    const ORC_ATTACK_COOLDOWN = 1.1;
    const ORC_PATROL_WAIT_TIME = 1.0;

    /* ==================================================
       遊戲狀態
    ================================================== */

    let assetsLoaded = false;
    let fakeLoadingCompleted = false;
    let loadingSequenceStarted = false;

    let gameStarted = false;
    let gameLoopStarted = false;

    let orientationTransitioning = false;

    let previousTime =
      performance.now();

    /* ==================================================
       相機
    ================================================== */

    const camera = {
      x: 0,
      y: 0,

      targetX: 0,
      targetY: 0
    };

    /* ==================================================
       玩家
    ================================================== */

    const player = {
      x: 340,
      y: WORLD_GROUND_Y,

      velocityX: 0,
      velocityY: 0,

      facing: 1,

      grounded: true,
      ducking: false,
      attacking: false,

      animation: "idle",

      frameIndex: 0,
      frameTimer: 0
    };

    /* ==================================================
       ORC1 敵人
    ================================================== */

    const orc = {
      x: 1100,
      y: WORLD_GROUND_Y,

      velocityX: 0,

      facing: -1,

      animation: "idle",

      frameIndex: 0,
      frameTimer: 0,

      state: "patrol",

      attacking: false,
      attackCooldown: 0,

      patrolMinX: 850,
      patrolMaxX: 1500,

      patrolDirection: -1,
      patrolWaitTimer: 0
    };

    /* ==================================================
       輸入
    ================================================== */

    const input = {
      left: false,
      right: false,
      run: false,
      duck: false,
      jump: false,
      attack: false
    };

    const pressed = {
      jump: false,
      attack: false
    };

    const joystick = {
      active: false,
      pointerId: null,

      centerX: 0,
      centerY: 0,
      radius: 0,

      x: 0,
      y: 0,
      magnitude: 0
    };

    /* ==================================================
       玩家動畫設定
    ================================================== */

    const playerAnimationDefinitions = {
      idle: {
        folder: "Idle",
        prefix: "idle",
        frameCount: 2,
        frameDuration: 0.42,
        loop: true
      },

      walk: {
        folder: "Walk",
        prefix: "Walk",
        frameCount: 4,
        frameDuration: 0.13,
        loop: true
      },

      run: {
        folder: "Run",
        prefix: "Run",
        frameCount: 8,
        frameDuration: 0.075,
        loop: true
      },

      duck: {
        folder: "Duck",
        prefix: "Duck",
        frameCount: 6,
        frameDuration: 0.08,
        loop: false
      },

      jump: {
        folder: "Jump",
        prefix: "Jump",
        frameCount: 8,
        frameDuration: 0.09,
        loop: false
      },

      attack: {
        folder: "ATK",
        prefix: "ATK",
        frameCount: 8,
        frameDuration: 0.065,
        loop: false
      }
    };

    /* ==================================================
       ORC1 動畫設定
    ================================================== */

    const enemyAnimationDefinitions = {
      idle: {
        folder: "Idle",
        prefix: "Idle",
        frameCount: 4,
        frameDuration: 0.19,
        loop: true
      },

      walk: {
        folder: "Walk",
        prefix: "Walk",
        frameCount: 6,
        frameDuration: 0.12,
        loop: true
      },

      attack: {
        folder: "ATK",
        prefix: "ATK",
        frameCount: 8,
        frameDuration: 0.085,
        loop: false
      }
    };

    const playerAnimations = {};
    const enemyAnimations = {};

    /* ==================================================
       工具
    ================================================== */

    function clamp(value, minimum, maximum) {
      return Math.max(
        minimum,
        Math.min(maximum, value)
      );
    }

    function wait(milliseconds) {
      return new Promise((resolve) => {
        window.setTimeout(
          resolve,
          milliseconds
        );
      });
    }

    function waitForNextPaint() {
      return new Promise((resolve) => {
        requestAnimationFrame(() => {
          requestAnimationFrame(resolve);
        });
      });
    }

    function isTouchDevice() {
      return (
        window.matchMedia(
          "(pointer: coarse)"
        ).matches ||
        window.matchMedia(
          "(hover: none)"
        ).matches
      );
    }

    function isPortrait() {
      return (
        window.innerHeight >
        window.innerWidth
      );
    }

    function padNumber(number) {
      return String(number).padStart(
        2,
        "0"
      );
    }

    function worldToScreenX(worldX) {
      return worldX - camera.x;
    }

    function worldToScreenY(worldY) {
      return worldY - camera.y;
    }

    /* ==================================================
       攻擊鍵設定
    ================================================== */

    const ATTACK_KEY_STORAGE =
      "hoodedCharacterAttackKey";

    const allowedAttackKeys = {
      KeyZ: "Z",
      KeyX: "X",
      KeyC: "C",
      KeyV: "V",
      KeyJ: "J",
      KeyK: "K",
      KeyL: "L"
    };

    let attackKeyCode =
      localStorage.getItem(
        ATTACK_KEY_STORAGE
      ) || "KeyZ";

    if (!allowedAttackKeys[attackKeyCode]) {
      attackKeyCode = "KeyZ";
    }

    attackKeySelect.value =
      attackKeyCode;

    attackKeyLabel.textContent =
      allowedAttackKeys[attackKeyCode];

    attackKeySelect.addEventListener(
      "change",
      () => {
        attackKeyCode =
          attackKeySelect.value;

        localStorage.setItem(
          ATTACK_KEY_STORAGE,
          attackKeyCode
        );

        attackKeyLabel.textContent =
          allowedAttackKeys[attackKeyCode];

        resetAllInputs();

        canvas.focus();
      }
    );

    /* ==================================================
       圖片載入
    ================================================== */

    function loadImage(path) {
      return new Promise(
        (resolve, reject) => {
          const image = new Image();

          image.onload = () => {
            resolve(image);
          };

          image.onerror = () => {
            reject(
              new Error(
                `無法載入圖片：${path}`
              )
            );
          };

          image.src = path;
        }
      );
    }

    async function loadAnimationGroup(
      destination,
      definitions,
      basePath
    ) {
      const tasks = [];

      for (
        const [
          animationName,
          definition
        ] of Object.entries(definitions)
      ) {
        destination[animationName] = {
          frames: [],

          frameDuration:
            definition.frameDuration,

          loop:
            definition.loop
        };

        for (
          let frameNumber = 1;
          frameNumber <= definition.frameCount;
          frameNumber += 1
        ) {
          const path =
            basePath +
            "/" +
            definition.folder +
            "/" +
            definition.prefix +
            padNumber(frameNumber) +
            ".png";

          tasks.push(
            loadImage(path).then(
              (image) => {
                destination[
                  animationName
                ].frames[
                  frameNumber - 1
                ] = image;
              }
            )
          );
        }
      }

      await Promise.all(tasks);
    }

    async function loadAllAnimations() {
      await Promise.all([
        loadAnimationGroup(
          playerAnimations,
          playerAnimationDefinitions,
          "2D_Character"
        ),

        loadAnimationGroup(
          enemyAnimations,
          enemyAnimationDefinitions,
          "2D_Enemy/ORC1"
        )
      ]);
    }

    /* ==================================================
       Loading
    ================================================== */

    function setLoadingProgress(
      progress,
      message
    ) {
      const safeProgress =
        clamp(progress, 0, 100);

      progressBar.style.width =
        `${safeProgress}%`;

      progressNumber.textContent =
        `${Math.floor(safeProgress)}%`;

      if (message) {
        loadingMessage.textContent =
          message;
      }
    }

    function animateProgress(
      start,
      end,
      duration,
      message
    ) {
      return new Promise((resolve) => {
        const startTime =
          performance.now();

        function update(currentTime) {
          const elapsed =
            currentTime - startTime;

          const ratio =
            Math.min(
              elapsed / duration,
              1
            );

          const easedRatio =
            1 -
            Math.pow(
              1 - ratio,
              2
            );

          const progress =
            start +
            (
              end - start
            ) *
            easedRatio;

          setLoadingProgress(
            progress,
            message
          );

          if (ratio < 1) {
            requestAnimationFrame(update);
          } else {
            resolve();
          }
        }

        requestAnimationFrame(update);
      });
    }

    function revealEnterButton() {

        !assetsLoaded ||
        !fakeLoadingCompleted
      ) {
        return;
      }

      window.setTimeout(() => {
        loadingStatus.classList.add(
          "hidden"
        );

        window.setTimeout(() => {

          );

    async function startLoadingSequence() {
      if (loadingSequenceStarted) {
        return;
      }

      loadingSequenceStarted = true;

      loadingPage.classList.add(
        "prepared"
      );

      await waitForNextPaint();

      loadingPage.classList.add(
        "visible"
      );

      try {
        await Promise.all([
          loadAllAnimations().then(() => {
            assetsLoaded = true;
          }),

          runFakeLoading()
        ]);

        revealEnterButton();
      } catch (error) {
        console.error(error);

        loadingMessage.textContent =
          "素材載入失敗，請檢查圖片路徑與大小寫";

        progressNumber.textContent =
          "錯誤";

        progressBar.style.width =
          "100%";

        progressBar.style.background =
          "#944b4b";

    /* ==================================================
       手機方向提示
    ================================================== */

    function showOrientationScreen() {
      orientationScreen.classList.remove(
        "fade-out"
      );

      orientationScreen.classList.add(
        "visible"
      );
    }

    async function leaveOrientationScreen() {
      if (
        orientationTransitioning ||
        !orientationScreen.classList.contains(
          "visible"
        )
      ) {
        return;
      }

      orientationTransitioning = true;

      loadingPage.classList.add(
        "prepared"
      );

      await waitForNextPaint();

      loadingPage.classList.add(
        "visible"
      );

      orientationScreen.classList.add(
        "fade-out"
      );

      startLoadingSequence();

      await wait(
        ORIENTATION_FADE_TIME
      );

      orientationScreen.classList.remove(
        "visible",
        "fade-out"
      );

      orientationTransitioning = false;
    }

    function handleOrientationState() {
      if (
        gameStarted ||
        !isTouchDevice()
      ) {
        return;
      }

      if (isPortrait()) {
        showOrientationScreen();
        return;
      }

      if (
        orientationScreen.classList.contains(
          "visible"
        )
      ) {
        leaveOrientationScreen();
      } else {
        startLoadingSequence();
      }
    }

    /* ==================================================
       開始遊戲
    ================================================== */

    function startGame() {
      if (
        gameStarted ||
        !assetsLoaded ||
        !fakeLoadingCompleted
      ) {
        return;
      }

      gameStarted = true;

      resetAllInputs();
      snapCameraToPlayer();

      loadingPage.classList.add(
        "game-entered"
      );

      document.body.classList.add(
        "game-started"
      );

      canvas.focus();

      window.setTimeout(() => {
        updateJoystickCenter();
      }, 100);
    }

    enterDungeonButton.addEventListener(
      "click",
      startGame
    );

    /* ==================================================
       玩家動畫
    ================================================== */

    function setPlayerAnimation(
      animationName,
      restart = false
    ) {
      if (!playerAnimations[animationName]) {
        return;
      }

      if (
        player.animation !== animationName ||
        restart
      ) {
        player.animation =
          animationName;

        player.frameIndex = 0;
        player.frameTimer = 0;
      }
    }

    function updatePlayerAnimation(deltaTime) {
      const animation =
        playerAnimations[
          player.animation
        ];

      if (
        !animation ||
        animation.frames.length === 0
      ) {
        return;
      }

      if (player.animation === "jump") {
        const lastFrame =
          animation.frames.length - 1;

        if (player.velocityY < -520) {
          player.frameIndex =
            Math.min(1, lastFrame);
        } else if (
          player.velocityY < -260
        ) {
          player.frameIndex =
            Math.min(2, lastFrame);
        } else if (
          player.velocityY < -60
        ) {
          player.frameIndex =
            Math.min(3, lastFrame);
        } else if (
          player.velocityY < 160
        ) {
          player.frameIndex =
            Math.min(4, lastFrame);
        } else if (
          player.velocityY < 380
        ) {
          player.frameIndex =
            Math.min(5, lastFrame);
        } else if (
          player.velocityY < 620
        ) {
          player.frameIndex =
            Math.min(6, lastFrame);
        } else {
          player.frameIndex =
            Math.min(7, lastFrame);
        }

        return;
      }

      player.frameTimer +=
        deltaTime;

      while (
        player.frameTimer >=
        animation.frameDuration
      ) {
        player.frameTimer -=
          animation.frameDuration;

        player.frameIndex += 1;

        if (
          player.frameIndex >=
          animation.frames.length
        ) {
          if (animation.loop) {
            player.frameIndex = 0;
          } else {
            player.frameIndex =
              animation.frames.length - 1;

            if (
              player.animation ===
              "attack"
            ) {
              player.attacking = false;

              setPlayerAnimation(
                "idle",
                true
              );
            }
          }
        }
      }
    }

    /* ==================================================
       ORC1 動畫
    ================================================== */

    function setOrcAnimation(
      animationName,
      restart = false
    ) {
      if (!enemyAnimations[animationName]) {
        return;
      }

      if (
        orc.animation !== animationName ||
        restart
      ) {
        orc.animation =
          animationName;

        orc.frameIndex = 0;
        orc.frameTimer = 0;
      }
    }

    function updateOrcAnimation(deltaTime) {
      const animation =
        enemyAnimations[
          orc.animation
        ];

      if (
        !animation ||
        animation.frames.length === 0
      ) {
        return;
      }

      orc.frameTimer +=
        deltaTime;

      while (
        orc.frameTimer >=
        animation.frameDuration
      ) {
        orc.frameTimer -=
          animation.frameDuration;

        orc.frameIndex += 1;

        if (
          orc.frameIndex >=
          animation.frames.length
        ) {
          if (animation.loop) {
            orc.frameIndex = 0;
          } else {
            orc.frameIndex =
              animation.frames.length - 1;

            if (
              orc.animation ===
              "attack"
            ) {
              orc.attacking = false;

              orc.attackCooldown =
                ORC_ATTACK_COOLDOWN;

              setOrcAnimation(
                "idle",
                true
              );
            }
          }
        }
      }
    }

    /* ==================================================
       玩家控制
    ================================================== */

    function triggerJump() {
      if (
        !gameStarted ||
        !player.grounded ||
        player.attacking ||
        player.ducking
      ) {
        return;
      }

      player.grounded = false;
      player.ducking = false;

      player.velocityY =
        -JUMP_FORCE;

      setPlayerAnimation(
        "jump",
        true
      );
    }

    function triggerPlayerAttack() {
      if (
        !gameStarted ||
        player.attacking
      ) {
        return;
      }

      player.attacking = true;
      player.ducking = false;

      player.velocityX = 0;

      setPlayerAnimation(
        "attack",
        true
      );
    }

    function updatePlayer(deltaTime) {
      if (!gameStarted) {
        if (assetsLoaded) {
          updatePlayerAnimation(
            deltaTime
          );
        }

        return;
      }

      if (pressed.jump) {
        triggerJump();

        pressed.jump = false;
      }

      if (pressed.attack) {
        triggerPlayerAttack();

        pressed.attack = false;
      }

      let horizontalDirection =
        Number(input.right) -
        Number(input.left);

      let analogStrength =
        Math.abs(
          horizontalDirection
        );

      if (joystick.active) {
        horizontalDirection =
          joystick.x;

        analogStrength =
          joystick.magnitude;
      }

      const joystickDucking =
        joystick.active &&
        joystick.y >
          DUCK_THRESHOLD &&
        Math.abs(joystick.x) < 0.55;

      player.ducking =
        (
          input.duck ||
          joystickDucking
        ) &&
        player.grounded &&
        !player.attacking;

      if (
        !player.attacking &&
        !player.ducking
      ) {
        if (
          Math.abs(horizontalDirection) >
          JOYSTICK_DEAD_ZONE
        ) {
          const shouldRun =
            input.run ||
            analogStrength >=
              RUN_THRESHOLD;

          const movementSpeed =
            shouldRun
              ? RUN_SPEED
              : WALK_SPEED;

          player.velocityX =
            horizontalDirection *
            movementSpeed;

          player.facing =
            horizontalDirection > 0
              ? 1
              : -1;

          setPlayerAnimation(
            shouldRun
              ? "run"
              : "walk"
          );
        } else {
          player.velocityX = 0;

          setPlayerAnimation("idle");
        }
      } else {
        player.velocityX = 0;

        if (player.ducking) {
          setPlayerAnimation("duck");
        }
      }

      if (!player.grounded) {
        player.velocityY +=
          GRAVITY *
          deltaTime;

        setPlayerAnimation("jump");
      }

      player.x +=
        player.velocityX *
        deltaTime;

      player.y +=
        player.velocityY *
        deltaTime;

      player.x = clamp(
        player.x,
        52,
        WORLD_WIDTH - 52
      );

      if (
        player.y >=
        WORLD_GROUND_Y
      ) {
        player.y =
          WORLD_GROUND_Y;

        player.velocityY = 0;
        player.grounded = true;
      }

      if (player.y < 100) {
        player.y = 100;
        player.velocityY = 0;
      }

      updatePlayerAnimation(
        deltaTime
      );
    }

    /* ==================================================
       ORC1 AI
    ================================================== */

    function startOrcAttack() {
      if (
        orc.attacking ||
        orc.attackCooldown > 0
      ) {
        return;
      }

      orc.attacking = true;
      orc.state = "attack";
      orc.velocityX = 0;

      orc.facing =
        player.x >= orc.x
          ? 1
          : -1;

      setOrcAnimation(
        "attack",
        true
      );
    }

    function updateOrc(deltaTime) {
      if (!gameStarted) {
        if (assetsLoaded) {
          updateOrcAnimation(
            deltaTime
          );
        }

        return;
      }

      if (orc.attackCooldown > 0) {
        orc.attackCooldown =
          Math.max(
            0,
            orc.attackCooldown -
            deltaTime
          );
      }

      /*
        攻擊動畫播放期間，
        敵人不能切換成其他動作。
      */
      if (orc.attacking) {
        orc.velocityX = 0;

        updateOrcAnimation(
          deltaTime
        );

        return;
      }

      const differenceX =
        player.x - orc.x;

      const distanceX =
        Math.abs(differenceX);

      /*
        1. 攻擊距離
      */
      if (
        distanceX <=
        ORC_ATTACK_RANGE
      ) {
        orc.state = "attack";
        orc.velocityX = 0;

        orc.facing =
          differenceX >= 0
            ? 1
            : -1;

        if (orc.attackCooldown <= 0) {
          startOrcAttack();
        } else {
          setOrcAnimation("idle");
        }
      }

      /*
        2. 偵測距離：追蹤玩家
      */
      else if (
        distanceX <=
        ORC_DETECTION_RANGE
      ) {
        orc.state = "chase";

        const direction =
          differenceX >= 0
            ? 1
            : -1;

        orc.facing = direction;

        orc.velocityX =
          direction *
          ORC_CHASE_SPEED;

        setOrcAnimation("walk");
      }

      /*
        3. 玩家太遠：回到巡邏
      */
      else {
        orc.state = "patrol";

        if (orc.patrolWaitTimer > 0) {
          orc.patrolWaitTimer =
            Math.max(
              0,
              orc.patrolWaitTimer -
              deltaTime
            );

          orc.velocityX = 0;

          setOrcAnimation("idle");
        } else {
          orc.velocityX =
            orc.patrolDirection *
            ORC_PATROL_SPEED;

          orc.facing =
            orc.patrolDirection;

          setOrcAnimation("walk");
        }
      }

      orc.x +=
        orc.velocityX *
        deltaTime;

      /*
        巡邏範圍只在非追蹤狀態生效。
      */
      if (orc.state === "patrol") {
        if (
          orc.x <=
          orc.patrolMinX
        ) {
          orc.x =
            orc.patrolMinX;

          orc.patrolDirection = 1;
          orc.patrolWaitTimer =
            ORC_PATROL_WAIT_TIME;

          orc.velocityX = 0;

          setOrcAnimation(
            "idle",
            true
          );
        } else if (
          orc.x >=
          orc.patrolMaxX
        ) {
          orc.x =
            orc.patrolMaxX;

          orc.patrolDirection = -1;
          orc.patrolWaitTimer =
            ORC_PATROL_WAIT_TIME;

          orc.velocityX = 0;

          setOrcAnimation(
            "idle",
            true
          );
        }
      }

      orc.x = clamp(
        orc.x,
        48,
        WORLD_WIDTH - 48
      );

      updateOrcAnimation(
        deltaTime
      );
    }

    /* ==================================================
       相機
    ================================================== */

    function calculateCameraTarget() {
      const horizontalAnchor =
        VIEW_WIDTH * 0.42;

      const verticalAnchor =
        VIEW_HEIGHT * 0.58;

      camera.targetX =
        player.x -
        horizontalAnchor;

      camera.targetY =
        player.y -
        verticalAnchor;

      camera.targetX = clamp(
        camera.targetX,
        0,
        WORLD_WIDTH -
          VIEW_WIDTH
      );

      camera.targetY = clamp(
        camera.targetY,
        0,
        WORLD_HEIGHT -
          VIEW_HEIGHT
      );
    }

    function snapCameraToPlayer() {
      calculateCameraTarget();

      camera.x =
        camera.targetX;

      camera.y =
        camera.targetY;
    }

    function updateCamera(deltaTime) {
      calculateCameraTarget();

      const smoothing =
        1 -
        Math.exp(
          -CAMERA_FOLLOW_SPEED *
          deltaTime
        );

      camera.x +=
        (
          camera.targetX -
          camera.x
        ) *
        smoothing;

      camera.y +=
        (
          camera.targetY -
          camera.y
        ) *
        smoothing;

      camera.x = clamp(
        camera.x,
        0,
        WORLD_WIDTH -
          VIEW_WIDTH
      );

      camera.y = clamp(
        camera.y,
        0,
        WORLD_HEIGHT -
          VIEW_HEIGHT
      );
    }

    /* ==================================================
       世界繪製
    ================================================== */

    function drawBackground() {
      const gradient =
        context.createLinearGradient(
          0,
          0,
          0,
          VIEW_HEIGHT
        );

      gradient.addColorStop(
        0,
        "#252e40"
      );

      gradient.addColorStop(
        1,
        "#111722"
      );

      context.fillStyle =
        gradient;

      context.fillRect(
        0,
        0,
        VIEW_WIDTH,
        VIEW_HEIGHT
      );
    }

    function drawDungeonWalls() {
      const tileSize = 96;

      const startColumn =
        Math.floor(
          camera.x /
          tileSize
        );

      const endColumn =
        Math.ceil(
          (
            camera.x +
            VIEW_WIDTH
          ) /
          tileSize
        );

      const startRow =
        Math.floor(
          camera.y /
          tileSize
        );

      const endRow =
        Math.ceil(
          (
            camera.y +
            VIEW_HEIGHT
          ) /
          tileSize
        );

      for (
        let row = startRow;
        row <= endRow;
        row += 1
      ) {
        for (
          let column = startColumn;
          column <= endColumn;
          column += 1
        ) {
          const worldX =
            column *
            tileSize;

          const worldY =
            row *
            tileSize;

          const screenX =
            worldToScreenX(worldX);

          const screenY =
            worldToScreenY(worldY);

          const alternate =
            (
              row +
              column
            ) %
              2 ===
            0;

          context.fillStyle =
            alternate
              ? "rgba(255,255,255,0.018)"
              : "rgba(0,0,0,0.025)";

          context.fillRect(
            Math.floor(screenX),
            Math.floor(screenY),
            tileSize + 1,
            tileSize + 1
          );

          context.strokeStyle =
            "rgba(255,255,255,0.025)";

          context.strokeRect(
            Math.floor(screenX),
            Math.floor(screenY),
            tileSize,
            tileSize
          );
        }
      }
    }

    function drawDungeonDecorations() {
      const pillars = [
        { x: 760, y: 930 },
        { x: 1200, y: 930 },
        { x: 1660, y: 930 },
        { x: 2140, y: 930 }
      ];

      for (
        const pillar of pillars
      ) {
        const screenX =
          worldToScreenX(
            pillar.x
          );

        const screenY =
          worldToScreenY(
            pillar.y
          );

        if (
          screenX < -160 ||
          screenX >
            VIEW_WIDTH + 160
        ) {
          continue;
        }

        context.fillStyle =
          "#202937";

        context.fillRect(
          screenX - 42,
          screenY,
          84,
          310
        );

        context.fillStyle =
          "#303b4c";

        context.fillRect(
          screenX - 55,
          screenY,
          110,
          24
        );

        context.fillRect(
          screenX - 55,
          screenY + 286,
          110,
          24
        );

        context.fillStyle =
          "rgba(255,255,255,0.045)";

        context.fillRect(
          screenX - 26,
          screenY + 34,
          12,
          235
        );
      }

      const torches = [
        { x: 520, y: 1040 },
        { x: 980, y: 1040 },
        { x: 1440, y: 1040 },
        { x: 1900, y: 1040 },
        { x: 2340, y: 1040 }
      ];

      for (
        const torch of torches
      ) {
        const screenX =
          worldToScreenX(
            torch.x
          );

        const screenY =
          worldToScreenY(
            torch.y
          );

        if (
          screenX < -100 ||
          screenX >
            VIEW_WIDTH + 100
        ) {
          continue;
        }

        context.fillStyle =
          "#4a3328";

        context.fillRect(
          screenX - 5,
          screenY,
          10,
          56
        );

        const glow =
          context.createRadialGradient(
            screenX,
            screenY,
            2,
            screenX,
            screenY,
            90
          );

        glow.addColorStop(
          0,
          "rgba(227,121,61,0.42)"
        );

        glow.addColorStop(
          1,
          "rgba(227,121,61,0)"
        );

        context.fillStyle =
          glow;

        context.beginPath();

        context.arc(
          screenX,
          screenY,
          90,
          0,
          Math.PI * 2
        );

        context.fill();

        context.fillStyle =
          "#d96e3d";

        context.beginPath();

        context.moveTo(
          screenX,
          screenY - 30
        );

        context.lineTo(
          screenX - 12,
          screenY
        );

        context.lineTo(
          screenX,
          screenY + 7
        );

        context.lineTo(
          screenX + 12,
          screenY
        );

        context.closePath();
        context.fill();
      }
    }

    function drawGround() {
      const screenGroundY =
        worldToScreenY(
          WORLD_GROUND_Y
        );

      context.fillStyle =
        "#303846";

      context.fillRect(
        0,
        screenGroundY,
        VIEW_WIDTH,
        VIEW_HEIGHT -
          screenGroundY
      );

      context.fillStyle =
        "#697588";

      context.fillRect(
        0,
        screenGroundY,
        VIEW_WIDTH,
        5
      );

      const floorTileWidth = 84;

      const firstTile =
        Math.floor(
          camera.x /
          floorTileWidth
        );

      const lastTile =
        Math.ceil(
          (
            camera.x +
            VIEW_WIDTH
          ) /
          floorTileWidth
        );

      context.fillStyle =
        "rgba(255,255,255,0.06)";

      for (
        let tile = firstTile;
        tile <= lastTile;
        tile += 1
      ) {
        const worldX =
          tile *
          floorTileWidth;

        const screenX =
          worldToScreenX(
            worldX
          );

        context.fillRect(
          screenX,
          screenGroundY + 38,
          48,
          4
        );
      }
    }

    function drawEntityShadow(
      worldX,
      radiusX,
      radiusY
    ) {
      const screenX =
        worldToScreenX(worldX);

      const screenY =
        worldToScreenY(
          WORLD_GROUND_Y
        );

      context.save();

      context.globalAlpha =
        0.25;

      context.fillStyle =
        "#000000";

      context.beginPath();

      context.ellipse(
        screenX,
        screenY + 5,
        radiusX,
        radiusY,
        0,
        0,
        Math.PI * 2
      );

      context.fill();

      context.restore();
    }

    function drawPlayer() {
      const animation =
        playerAnimations[
          player.animation
        ];

      if (
        !animation ||
        animation.frames.length === 0
      ) {
        return;
      }

      const frame =
        animation.frames[
          Math.min(
            player.frameIndex,
            animation.frames.length - 1
          )
        ];

      if (!frame) {
        return;
      }

      const drawWidth =
        frame.width *
        PLAYER_SCALE;

      const drawHeight =
        frame.height *
        PLAYER_SCALE;

      const screenX =
        worldToScreenX(
          player.x
        );

      const screenY =
        worldToScreenY(
          player.y
        );

      context.save();

      context.translate(
        Math.round(screenX),
        Math.round(screenY)
      );

      context.scale(
        player.facing,
        1
      );

      context.drawImage(
        frame,
        Math.round(
          -drawWidth / 2
        ),
        Math.round(
          -drawHeight
        ),
        Math.round(
          drawWidth
        ),
        Math.round(
          drawHeight
        )
      );

      context.restore();
    }

    function drawOrc() {
      const animation =
        enemyAnimations[
          orc.animation
        ];

      if (
        !animation ||
        animation.frames.length === 0
      ) {
        return;
      }

      const frame =
        animation.frames[
          Math.min(
            orc.frameIndex,
            animation.frames.length - 1
          )
        ];

      if (!frame) {
        return;
      }

      const screenX =
        worldToScreenX(
          orc.x
        );

      const screenY =
        worldToScreenY(
          orc.y
        );

      /*
        畫面外不繪製，但 AI 仍可繼續運作。
      */
      if (
        screenX < -160 ||
        screenX >
          VIEW_WIDTH + 160
      ) {
        return;
      }

      const drawWidth =
        frame.width *
        ENEMY_SCALE;

      const drawHeight =
        frame.height *
        ENEMY_SCALE;

      context.save();

      context.translate(
        Math.round(screenX),
        Math.round(screenY)
      );

      context.scale(
        orc.facing,
        1
      );

      context.drawImage(
        frame,
        Math.round(
          -drawWidth / 2
        ),
        Math.round(
          -drawHeight
        ),
        Math.round(
          drawWidth
        ),
        Math.round(
          drawHeight
        )
      );

      context.restore();
    }

    function drawDebugHud() {
      if (!gameStarted) {
        return;
      }

      const stateNames = {
        patrol: "巡邏",
        chase: "追蹤",
        attack: "攻擊"
      };

      context.save();

      context.fillStyle =
        "rgba(0,0,0,0.48)";

      context.fillRect(
        16,
        22,
        294,
        142
      );

      context.fillStyle =
        "#ffffff";

      context.font =
        "18px Arial, Microsoft JhengHei";

      context.fillText(
        `世界：${WORLD_WIDTH} × ${WORLD_HEIGHT}`,
        42,
        51
      );

      context.fillText(
        `玩家：${Math.round(player.x)}, ${Math.round(player.y)}`,
        42,
        77
      );

      context.fillText(
        `相機：${Math.round(camera.x)}, ${Math.round(camera.y)}`,
        42,
        103
      );

      context.fillText(
        `視窗：${VIEW_WIDTH} × ${VIEW_HEIGHT}`,
        42,
        129
      );

      context.fillText(
        `ORC1：${stateNames[orc.state] || orc.state}`,
        42,
        155
      );

      context.restore();
    }

    function render() {
      context.clearRect(
        0,
        0,
        VIEW_WIDTH,
        VIEW_HEIGHT
      );

      drawBackground();
      drawDungeonWalls();
      drawDungeonDecorations();
      drawGround();

      /*
        已移除：
        drawWorldBoundaryMarkers();

        左側 8px 半透明直條不再繪製。
      */

      if (assetsLoaded) {
        drawEntityShadow(
          orc.x,
          47,
          11
        );

        drawOrc();

        drawEntityShadow(
          player.x,
          50,
          12
        );

        drawPlayer();
      }

      drawDebugHud();
    }

    /* ==================================================
       鍵盤輸入
    ================================================== */

    function getControlFromKey(code) {
      if (code === attackKeyCode) {
        return "attack";
      }

      const keyBindings = {
        ArrowLeft: "left",
        KeyA: "left",

        ArrowRight: "right",
        KeyD: "right",

        ArrowUp: "jump",
        KeyW: "jump",
        Space: "jump",

        ArrowDown: "duck",
        KeyS: "duck",

        ShiftLeft: "run",
        ShiftRight: "run"
      };

      return (
        keyBindings[code] ||
        null
      );
    }

    function setControl(
      controlName,
      active,
      isNewPress = false
    ) {
      if (
        !(controlName in input)
      ) {
        return;
      }

      if (
        active &&
        isNewPress &&
        (
          controlName === "jump" ||
          controlName === "attack"
        )
      ) {
        pressed[
          controlName
        ] = true;
      }

      input[
        controlName
      ] = active;
    }

    window.addEventListener(
      "keydown",
      (event) => {
        if (
          !gameStarted ||
          document.activeElement ===
            attackKeySelect
        ) {
          return;
        }

        const controlName =
          getControlFromKey(
            event.code
          );

        if (!controlName) {
          return;
        }

        event.preventDefault();

        setControl(
          controlName,
          true,
          !input[controlName]
        );
      }
    );

    window.addEventListener(
      "keyup",
      (event) => {
        const controlName =
          getControlFromKey(
            event.code
          );

        if (!controlName) {
          return;
        }

        event.preventDefault();

        setControl(
          controlName,
          false
        );
      }
    );

    /* ==================================================
       虛擬搖桿
    ================================================== */

    function updateJoystickCenter() {
      const rect =
        joystickBase.getBoundingClientRect();

      joystick.centerX =
        rect.left +
        rect.width / 2;

      joystick.centerY =
        rect.top +
        rect.height / 2;

      joystick.radius =
        rect.width * 0.34;
    }

    function updateJoystickPosition(
      clientX,
      clientY
    ) {
      const deltaX =
        clientX -
        joystick.centerX;

      const deltaY =
        clientY -
        joystick.centerY;

      const distance =
        Math.hypot(
          deltaX,
          deltaY
        );

      const limitedDistance =
        Math.min(
          distance,
          joystick.radius
        );

      const angle =
        Math.atan2(
          deltaY,
          deltaX
        );

      const visualX =
        Math.cos(angle) *
        limitedDistance;

      const visualY =
        Math.sin(angle) *
        limitedDistance;

      joystickStick.style.transform =
        `translate(
          calc(-50% + ${visualX}px),
          calc(-50% + ${visualY}px)
        )`;

      const normalizedX =
        joystick.radius > 0
          ? visualX /
            joystick.radius
          : 0;

      const normalizedY =
        joystick.radius > 0
          ? visualY /
            joystick.radius
          : 0;

      joystick.x =
        Math.abs(normalizedX) <
        JOYSTICK_DEAD_ZONE
          ? 0
          : normalizedX;

      joystick.y =
        Math.abs(normalizedY) <
        JOYSTICK_DEAD_ZONE
          ? 0
          : normalizedY;

      joystick.magnitude =
        Math.min(
          1,
          Math.hypot(
            joystick.x,
            joystick.y
          )
        );
    }

    function resetJoystick() {
      joystick.active = false;
      joystick.pointerId = null;

      joystick.x = 0;
      joystick.y = 0;
      joystick.magnitude = 0;

      joystickStick.style.transform =
        "translate(-50%, -50%)";

      joystickZone.classList.remove(
        "active"
      );
    }

    joystickZone.addEventListener(
      "pointerdown",
      (event) => {
        if (!gameStarted) {
          return;
        }

        event.preventDefault();

        updateJoystickCenter();

        joystick.active = true;

        joystick.pointerId =
          event.pointerId;

        joystickZone.classList.add(
          "active"
        );

        if (
          joystickZone.setPointerCapture
        ) {
          joystickZone.setPointerCapture(
            event.pointerId
          );
        }

        updateJoystickPosition(
          event.clientX,
          event.clientY
        );
      }
    );

    joystickZone.addEventListener(
      "pointermove",
      (event) => {
        if (
          !gameStarted ||
          !joystick.active ||
          event.pointerId !==
            joystick.pointerId
        ) {
          return;
        }

        event.preventDefault();

        updateJoystickPosition(
          event.clientX,
          event.clientY
        );
      }
    );

    joystickZone.addEventListener(
      "pointerup",
      resetJoystick
    );

    joystickZone.addEventListener(
      "pointercancel",
      resetJoystick
    );

    joystickZone.addEventListener(
      "lostpointercapture",
      resetJoystick
    );

    /* ==================================================
       手機動作按鈕
    ================================================== */

    document
      .querySelectorAll(
        ".action-button"
      )
      .forEach((button) => {
        const controlName =
          button.dataset.control;

        function activate(event) {
          if (!gameStarted) {
            return;
          }

          event.preventDefault();

          button.classList.add(
            "active"
          );

          setControl(
            controlName,
            true,
            !input[controlName]
          );

          if (
            button.setPointerCapture
          ) {
            button.setPointerCapture(
              event.pointerId
            );
          }
        }

        function deactivate(event) {
          event.preventDefault();

          button.classList.remove(
            "active"
          );

          setControl(
            controlName,
            false
          );
        }

        button.addEventListener(
          "pointerdown",
          activate
        );

        button.addEventListener(
          "pointerup",
          deactivate
        );

        button.addEventListener(
          "pointercancel",
          deactivate
        );

        button.addEventListener(
          "lostpointercapture",
          deactivate
        );

        button.addEventListener(
          "contextmenu",
          (event) => {
            event.preventDefault();
          }
        );
      });

    /* ==================================================
       重置輸入
    ================================================== */

    function resetAllInputs() {
      for (
        const controlName of
        Object.keys(input)
      ) {
        input[
          controlName
        ] = false;
      }

      pressed.jump = false;
      pressed.attack = false;

      resetJoystick();

      document
        .querySelectorAll(
          ".action-button"
        )
        .forEach((button) => {
          button.classList.remove(
            "active"
          );
        });
    }

    window.addEventListener(
      "blur",
      resetAllInputs
    );

    document.addEventListener(
      "visibilitychange",
      () => {
        if (document.hidden) {
          resetAllInputs();
        }
      }
    );

    window.addEventListener(
      "resize",
      () => {
        handleOrientationState();

        window.setTimeout(() => {
          updateJoystickCenter();
        }, 100);
      }
    );

    window.addEventListener(
      "orientationchange",
      () => {
        resetAllInputs();

        window.setTimeout(() => {
          handleOrientationState();
          updateJoystickCenter();
        }, 250);
      }
    );

    /* ==================================================
       遊戲循環
    ================================================== */

    function gameLoop(currentTime) {
      const rawDeltaTime =
        (
          currentTime -
          previousTime
        ) /
        1000;

      const deltaTime =
        Math.min(
          rawDeltaTime,
          1 / 30
        );

      previousTime =
        currentTime;

      updatePlayer(deltaTime);
      updateOrc(deltaTime);

      if (gameStarted) {
        updateCamera(deltaTime);
      }

      render();

      requestAnimationFrame(
        gameLoop
      );
    }

    /* ==================================================
       初始化
    ================================================== */

    function initializeGame() {
      if (!gameLoopStarted) {
        gameLoopStarted = true;

        requestAnimationFrame(
          gameLoop
        );
      }

      if (
        isTouchDevice() &&
        isPortrait()
      ) {
        showOrientationScreen();
      } else {
        startLoadingSequence();
      }
    }

    initializeGame();
  </script>
</body>
